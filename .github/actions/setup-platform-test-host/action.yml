name: Set up platform test host
description: Install the Linux libraries, WebDriver, and browser required by the avenOS E2E stack

inputs:
  browser-e2e:
    description: Install browser and WebDriver tools in addition to native build libraries
    default: "true"

runs:
  using: composite
  steps:
    - name: Install native Tauri and WebDriver dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # Ubuntu 26.04 renamed webkit2gtk-driver to webkitgtk-webdriver; both
        # ship /usr/bin/WebKitWebDriver, which deploy/e2e/tauri-driver.ts uses.
        webdriver_package=webkit2gtk-driver
        if [[ "$(apt-cache policy webkitgtk-webdriver)" == *"Candidate: "[0-9]* ]]; then
          webdriver_package=webkitgtk-webdriver
        fi
        sudo apt-get install --yes --no-install-recommends \
          build-essential \
          curl \
          file \
          libasound2-dev \
          libayatana-appindicator3-dev \
          libdbus-1-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf \
          pkg-config \
          "$webdriver_package" \
          wget \
          xvfb
    - name: Install native WebDriver
      if: inputs.browser-e2e == 'true'
      shell: bash
      run: cargo install tauri-driver --locked
    - name: Restore the lockfile-scoped Playwright browser cache
      if: inputs.browser-e2e == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    - name: Install the lockfile-matched Playwright Chromium
      if: inputs.browser-e2e == 'true'
      shell: bash
      run: bunx playwright install chromium
