name: Set up platform test host
description: Install the Linux libraries and WebDriver required by the native avenOS E2E client

runs:
  using: composite
  steps:
    - name: Install native Tauri and WebDriver dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential \
          curl \
          file \
          libasound2-dev \
          libayatana-appindicator3-dev \
          libdbus-1-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf \
          pkg-config \
          webkit2gtk-driver \
          wget \
          xvfb
        cargo install tauri-driver --locked
