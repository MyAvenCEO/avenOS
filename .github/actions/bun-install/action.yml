name: Install dependencies
description: >-
  Authenticate to GitHub Packages, then install with a frozen lockfile.
  One place, because @myavenceo/* needs a registry token and four workflows
  install — repeating the auth step in each is how they drift.

  Assumes bun is already set up: every caller pins its own bun-version, so
  installing it again here would only duplicate that decision.

inputs:
  token:
    description: >-
      Token used to read @myavenceo/* from GitHub Packages. Pass the calling
      repository's PACKAGE_READ_TOKEN secret. It is a classic token scoped to
      read:packages because the packages belong to another repository.
    required: true

runs:
  using: composite
  steps:
    - name: Restore the lockfile-scoped Bun download cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-1.3.13-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-1.3.13-${{ runner.os }}-
    - name: Authenticate to GitHub Packages
      shell: bash
      env:
        PACKAGE_READ_TOKEN: ${{ inputs.token }}
      # The token goes in the PROJECT .npmrc, because that is where it is KNOWN
      # to work. Writing $HOME/.npmrc instead 401'd every install, because bun
      # DOES NOT READ $HOME/.npmrc UNDER ACTIONS — not the token, the whole
      # file. Point a scope's registry at a dead host from $HOME and bun goes
      # to npm.pkg.github.com regardless.
      #
      # On a laptop it reads the file perfectly: 1.3.13 and 1.4.0, merged with
      # a project file, on the --frozen-lockfile path, last-duplicate-wins.
      # That gap is what made this expensive — the step writes a file, reports
      # success, and the install then fails with a 401 that reads like a
      # permissions problem rather than a missing credential.
      #
      # Worth knowing while you are here: bun ignores NPM_CONFIG_USERCONFIG
      # entirely, so pointing it at a file outside the checkout is not an
      # alternative.
      #
      # `${NODE_AUTH_TOKEN}` in the tracked file is not the answer either — a
      # project .npmrc outranks ~/.npmrc, so an empty value on a developer's
      # machine would override their real login. See the note in .npmrc itself.
      #
      # What made the old leak possible was not the location. It was that a
      # release job ran `git add -A` and swept the modified file into a commit.
      # `skip-worktree` closes that: git treats the file as unchanged, so
      # `git add -A` cannot stage it, and an explicit `git add .npmrc` is not
      # something any job does by accident.
      run: |
        set -euo pipefail
        if [[ -z "$PACKAGE_READ_TOKEN" ]]; then
          echo '::error::PACKAGE_READ_TOKEN is missing. Resume the deployment bootstrap to verify and configure it.'
          exit 64
        fi
        printf '//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGE_READ_TOKEN" >> .npmrc
        git update-index --skip-worktree .npmrc
    - shell: bash
      run: bun install --frozen-lockfile
    - name: Refuse to proceed if a credential reached the checkout
      shell: bash
      # Belt and braces for the failure this repo already had: a token written
      # into .npmrc, swept into a release commit by `git add -A`, pushed public.
      # `skip-worktree` above is the mechanism; this is the check that the
      # mechanism held, and it looks at what git would actually COMMIT rather
      # than at the working tree, which now legitimately holds the token.
      run: |
        set -euo pipefail
        # The pattern is written as a character class so this file does not
        # match itself — a literal would make the guard permanently red.
        pattern='_authToken=[a-z]\{2,4\}_'
        if git diff --cached --name-only | grep -q .; then
          if git diff --cached | grep -q "$pattern"; then
            echo "::error::A registry token is staged for commit. It must never leave the runner."
            exit 1
          fi
        fi
        if git grep --cached -nI "$pattern" -- . >/dev/null 2>&1; then
          echo "::error::A registry token is committed in a tracked file."
          git grep --cached -nI "$pattern" -- . | sed 's/_authToken=.*/_authToken=***/'
          exit 1
        fi
