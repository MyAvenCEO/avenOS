name: Install dependencies
description: >-
  Authenticate to GitHub Packages, then install with a frozen lockfile.
  One place, because @myavenceo/aven-ceo needs a registry token and four
  workflows install — repeating the auth step in each is how they drift.

  Assumes bun is already set up: every caller pins its own bun-version, so
  installing it again here would only duplicate that decision.

inputs:
  token:
    description: >-
      Token used to read @myavenceo/* from GitHub Packages. Pass the calling
      job's secrets.GITHUB_TOKEN; the job needs `permissions: packages: read`.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to GitHub Packages
      shell: bash
      # Written to the RUNNER'S HOME, never to the repo.
      #
      # This previously appended to the tracked `.npmrc`, which the release job
      # then swept up with `git add -A` — putting the token into two commits on
      # a public repository. They were ephemeral GITHUB_TOKENs and were revoked
      # when their jobs ended, but the pattern would have leaked any longer-lived
      # credential, and a stale one in a tracked file also outranks a
      # developer's own login and 401s their installs.
      #
      # $HOME/.npmrc is outside the checkout, so there is nothing for `git add`
      # to find.
      run: printf '//npm.pkg.github.com/:_authToken=%s\n' '${{ inputs.token }}' >> "$HOME/.npmrc"
    - shell: bash
      run: bun install --frozen-lockfile
    - name: Refuse to proceed if a credential reached the checkout
      shell: bash
      # The failure this repo already had: a token written into the tracked
      # .npmrc, swept into a release commit by `git add -A`, pushed public.
      # Cheap to check, and the check is what makes the fix durable.
      run: |
        # The pattern is written as a character class so this file does not
        # match itself — a literal would make the guard permanently red.
        pattern='_authToken=[a-z]\{2,4\}_'
        if git grep -nI "$pattern" -- . >/dev/null 2>&1; then
          echo "::error::A registry token is present in a tracked file. Credentials belong in \$HOME/.npmrc."
          git grep -nI "$pattern" -- . | sed 's/_authToken=.*/_authToken=***/'
          exit 1
        fi
