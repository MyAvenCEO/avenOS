name: platform-deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Shared identity or isolated platform environment
        default: next
        required: true
        type: choice
        options: [identity, next, production]
      ref:
        description: Git ref to build and deploy
        required: true
        type: string
      recover_from_backup:
        description: Restore the newest verified backups into fresh empty volumes before starting services
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Install native Tauri/WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev webkit2gtk-driver libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb
          cargo install tauri-driver --locked
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Static, unit, infrastructure, and deployment-source checks
        run: |
          bun run check:docs
          bun run check
          bun run check:identity
          bun run check:api
          bun run check:checkout
          bun run --cwd libs/aven-identity check
          bun run --cwd libs/aven-hosting check
          bun run --cwd services/static-site-host check
          bun run --cwd libs/aven-customer-contracts check
          bun run --cwd libs/aven-customer-runtime check
          bun run --cwd libs/aven-actors check
          bun run --cwd libs/aven-artifact-store check
          bun run --cwd libs/aven-document-ingest check
          bun run --cwd libs/aven-llm-client check
          bun run --cwd services/platform-provisioner check
          bun run --cwd services/intent-service check
          bun run --cwd services/actor-runner check
          bun run test:identity
          bun run test:api
          bun run --cwd libs/aven-identity test
          bun run --cwd libs/aven-hosting test
          bun run --cwd services/static-site-host test
          bun run --cwd libs/aven-customer-contracts test
          bun run --cwd libs/aven-customer-runtime test
          bun run --cwd libs/aven-actors test
          bun run --cwd libs/aven-artifact-store test
          cargo test --locked --workspace --manifest-path services/artifact-store/Cargo.toml
          bun run --cwd services/platform-provisioner test
          bun run --cwd services/intent-service test
          bun run --cwd services/actor-runner test
          bun run test:infra
          bun run test:deploy
          bun run test:recovery
      - name: Test app integration
        run: bun test
        working-directory: app
      - run: xvfb-run --auto-servernum bun run test:e2e:platform

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      identity: ghcr.io/myavenceo/aven-identity@${{ steps.identity.outputs.digest }}
      api: ghcr.io/myavenceo/aven-api@${{ steps.api.outputs.digest }}
      checkout: ghcr.io/myavenceo/aven-checkout@${{ steps.checkout.outputs.digest }}
      static_host: ghcr.io/myavenceo/aven-static-site-host@${{ steps.static_host.outputs.digest }}
      provisioner: ghcr.io/myavenceo/aven-platform-provisioner@${{ steps.provisioner.outputs.digest }}
      intent: ghcr.io/myavenceo/aven-intent-service@${{ steps.intent.outputs.digest }}
      actor: ghcr.io/myavenceo/aven-actor-runner@${{ steps.actor.outputs.digest }}
      artifact: ghcr.io/myavenceo/aven-artifact-store@${{ steps.artifact.outputs.digest }}
      operations: ghcr.io/myavenceo/aven-operations@${{ steps.operations.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: identity
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-identity:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/aven-api/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-api:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - id: checkout
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/checkout/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-checkout:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - id: static_host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/static-site-host/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-static-site-host:run-${{ github.run_id }}-${{ github.run_attempt }}
      - id: provisioner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/platform-provisioner/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-platform-provisioner:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - id: intent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/intent-service/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-intent-service:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - id: actor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/actor-runner/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-actor-runner:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - id: artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/artifact-store/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-artifact-store:run-${{ github.run_id }}-${{ github.run_attempt }}
      - id: operations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/operations/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-operations:run-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    concurrency:
      group: aven-platform-deploy-${{ inputs.target }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.PULUMI_STATE_S3_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.PULUMI_STATE_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK }}
      NEXT_PULUMI_STACK: ${{ vars.NEXT_PULUMI_STACK }}
      NEXT_PULUMI_BACKEND: ${{ vars.NEXT_PULUMI_BACKEND }}
      NEXT_STATE_S3_ACCESS_KEY_ID: ${{ secrets.NEXT_STATE_S3_ACCESS_KEY_ID }}
      NEXT_STATE_S3_SECRET_ACCESS_KEY: ${{ secrets.NEXT_STATE_S3_SECRET_ACCESS_KEY }}
      NEXT_PULUMI_CONFIG_PASSPHRASE: ${{ secrets.NEXT_PULUMI_CONFIG_PASSPHRASE }}
      PRODUCTION_PULUMI_STACK: ${{ vars.PRODUCTION_PULUMI_STACK }}
      PRODUCTION_PULUMI_BACKEND: ${{ vars.PRODUCTION_PULUMI_BACKEND }}
      PRODUCTION_STATE_S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_STATE_S3_ACCESS_KEY_ID }}
      PRODUCTION_STATE_S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_STATE_S3_SECRET_ACCESS_KEY }}
      PRODUCTION_PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PRODUCTION_PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_BACKEND: s3://${{ vars.PULUMI_STATE_S3_BUCKET }}/avenos/platform?endpoint=${{ vars.PULUMI_STATE_S3_REGION }}.your-objectstorage.com&region=${{ vars.PULUMI_STATE_S3_REGION }}&s3ForcePathStyle=true&awssdk=v2
      POLAR_API_KEY: ${{ secrets.POLAR_API_KEY }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
      AVEN_TIER_NAME: ${{ secrets.AVEN_TIER_NAME }}
      POLAR_SERVER: ${{ vars.POLAR_SERVER }}
      POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID }}
      SMTP_URL: ${{ secrets.SMTP_URL }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_REPLY_TO: ${{ vars.SMTP_REPLY_TO }}
      DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      ANDROID_APP_CERT_SHA256_FINGERPRINTS: ${{ vars.ANDROID_APP_CERT_SHA256_FINGERPRINTS }}
      IDENTITY_IMAGE: ${{ needs.publish.outputs.identity }}
      API_IMAGE: ${{ needs.publish.outputs.api }}
      CHECKOUT_IMAGE: ${{ needs.publish.outputs.checkout }}
      STATIC_SITE_HOST_IMAGE: ${{ needs.publish.outputs.static_host }}
      PLATFORM_PROVISIONER_IMAGE: ${{ needs.publish.outputs.provisioner }}
      INTENT_SERVICE_IMAGE: ${{ needs.publish.outputs.intent }}
      ACTOR_RUNNER_IMAGE: ${{ needs.publish.outputs.actor }}
      ARTIFACT_STORE_IMAGE: ${{ needs.publish.outputs.artifact }}
      OPERATIONS_IMAGE: ${{ needs.publish.outputs.operations }}
      LLM_GATEWAY_MODELS_JSON: ${{ vars.LLM_GATEWAY_MODELS_JSON }}
      LLM_GATEWAY_CREDENTIALS_JSON: ${{ secrets.LLM_GATEWAY_CREDENTIALS_JSON }}
      LLM_GATEWAY_TIMEOUT_SECONDS: ${{ vars.LLM_GATEWAY_TIMEOUT_SECONDS }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKUP_REPOSITORY_BASE: ${{ vars.BACKUP_REPOSITORY_BASE }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_RESTIC_PASSWORD: ${{ secrets.BACKUP_RESTIC_PASSWORD }}
      DEPLOYMENT_TARGET: ${{ inputs.target }}
      RECOVER_FROM_BACKUP: ${{ inputs.recover_from_backup }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install identity DNS lookup tool
        if: inputs.target == 'identity'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends dnsutils
      - name: Record deployed commit
        run: echo "DEPLOYED_REF_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
      - name: Render and deploy selected target
        shell: bash
        run: bash deploy/release/deploy.sh
