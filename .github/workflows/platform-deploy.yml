name: platform-deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select one independent deployment
        default: next
        required: true
        type: choice
        options: [identity, next, production]
      release_run_id:
        description: Successful verified platform-release run (immutable images)
        required: true
        type: string
      next_proof_run_id:
        description: Successful platform-deploy run that verified this release in next (production-only)
        required: false
        type: string
      recover_from_backup:
        description: Restore the newest verified backup into a fresh empty target
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Verify release provenance and target authority before requesting secrets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          NEXT_PROOF_RUN_ID: ${{ inputs.next_proof_run_id }}
          DEPLOYMENT_TARGET: ${{ inputs.target }}
          RECOVER_FROM_BACKUP: ${{ inputs.recover_from_backup }}
          DEPLOYMENT_ENVIRONMENT_PREFIX: ${{ vars.DEPLOYMENT_ENVIRONMENT_PREFIX }}
          DEPLOYMENT_TARGETS_JSON: ${{ vars.DEPLOYMENT_TARGETS_JSON }}
        run: bun scripts/verify-platform-release.ts

  deploy:
    needs: validate
    uses: ./.github/workflows/platform-deploy-target.yml
    secrets: inherit
    with:
      target: ${{ inputs.target }}
      manifest: ${{ needs.validate.outputs.manifest }}
      recover_from_backup: ${{ inputs.recover_from_backup }}
