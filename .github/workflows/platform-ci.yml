name: platform-ci

on:
  pull_request:
    paths:
      - app/**
      - deploy/**
      - infrastructure/platform/**
      - libs/aven-hosting/**
      - libs/aven-identity/**
      - libs/aven-customer-contracts/**
      - libs/aven-customer-runtime/**
      - libs/aven-actors/**
      - services/aven-api/**
      - services/checkout/**
      - services/identity/**
      - services/static-site-host/**
      - services/platform-provisioner/**
      - services/intent-service/**
      - services/actor-runner/**
      - services/artifact-store/**
      - libs/aven-artifact-store/**
      - libs/aven-document-ingest/**
      - libs/aven-llm-client/**
      - .dockerignore
      - bun.lock
      - package.json
      - .github/workflows/platform-ci.yml
      - .github/workflows/platform-deploy.yml
      - .github/workflows/platform-infrastructure.yml
      - .github/workflows/platform-operations.yml
  push:
    branches: [main, next]
    paths:
      - app/**
      - deploy/**
      - infrastructure/platform/**
      - libs/aven-hosting/**
      - libs/aven-identity/**
      - libs/aven-customer-contracts/**
      - libs/aven-customer-runtime/**
      - libs/aven-actors/**
      - services/aven-api/**
      - services/checkout/**
      - services/identity/**
      - services/static-site-host/**
      - services/platform-provisioner/**
      - services/intent-service/**
      - services/actor-runner/**
      - services/artifact-store/**
      - libs/aven-artifact-store/**
      - libs/aven-document-ingest/**
      - libs/aven-llm-client/**
      - .dockerignore
      - bun.lock
      - package.json
      - .github/workflows/platform-ci.yml
      - .github/workflows/platform-deploy.yml
      - .github/workflows/platform-infrastructure.yml
      - .github/workflows/platform-operations.yml

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Install native Tauri/WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev webkit2gtk-driver libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev patchelf xvfb
          cargo install tauri-driver --locked
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: Static checks
        run: |
          bun run check:docs
          bun run check
          bun run check:identity
          bun run check:api
          bun run check:checkout
          bun run --cwd libs/aven-identity check
          bun run --cwd libs/aven-hosting check
          bun run --cwd services/static-site-host check
          bun run --cwd libs/aven-customer-contracts check
          bun run --cwd libs/aven-customer-runtime check
          bun run --cwd libs/aven-actors check
          bun run --cwd libs/aven-artifact-store check
          bun run --cwd libs/aven-document-ingest check
          bun run --cwd libs/aven-llm-client check
          bun run --cwd services/platform-provisioner check
          bun run --cwd services/intent-service check
          bun run --cwd services/actor-runner check
      - name: Test app integration
        run: bun test
        working-directory: app
      - name: Unit and infrastructure tests
        run: |
          bun run test:identity
          bun run test:api
          bun run --cwd libs/aven-identity test
          bun run --cwd libs/aven-hosting test
          bun run --cwd services/static-site-host test
          bun run --cwd libs/aven-customer-contracts test
          bun run --cwd libs/aven-customer-runtime test
          bun run --cwd libs/aven-actors test
          bun run --cwd libs/aven-artifact-store test
          cargo test --locked --workspace --manifest-path services/artifact-store/Cargo.toml
          bun run --cwd services/platform-provisioner test
          bun run --cwd services/intent-service test
          bun run --cwd services/actor-runner test
          bun run test:infra
      - name: Production builds
        run: |
          bun run --cwd app build
          bun run build:identity
          bun run build:api
          bun run build:checkout
          bun run --cwd services/platform-provisioner build
          bun run --cwd services/intent-service build
          bun run --cwd services/actor-runner build
      - name: Validate shell and Compose sources
        run: bun run test:deploy
      - name: Build and drill database recovery image
        run: bun run test:recovery
      - name: Full-stack browser E2E
        run: xvfb-run --auto-servernum bun run test:e2e:platform
