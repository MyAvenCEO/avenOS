name: platform-ci

# A required check must be emitted even for documentation-only changes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/platform-verification.yml
    secrets:
      PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}

  gate:
    name: Platform release gate
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete applicable verification job
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
