name: Android app

on:
  pull_request:
    paths:
      - 'app/**'
      - 'libs/aven-voice-*/**'
      - 'libs/tauri-plugin-android-passkey/**'
      - 'scripts/build-app-android.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/actions/bun-install/action.yml'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'libs/aven-voice-*/**'
      - 'libs/tauri-plugin-android-passkey/**'
      - 'scripts/build-app-android.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/actions/bun-install/action.yml'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  debug-apk:
    name: ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
            app/src-tauri/gen/android/**/*.gradle*
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
          targets: aarch64-linux-android
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: android-aarch64-debug
      - name: Build the Android APK
        run: NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" bun run build:app:android
      - name: Verify the APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk=(dist/android/*-debug-aarch64.apk)
          test "${#apk[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "${apk[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "${apk[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apk[0]}" | grep -q "package: name='ceo.aven.os'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apk[0]}" | grep -q "sdkVersion:'28'"
          if unzip -Z1 "${apk[0]}" | grep -E '^assets/onnxruntime/(lib|ONNXRuntime-)'; then
            echo 'desktop ONNX Runtime assets must not be bundled into Android packages'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: avenOS-android-debug-arm64
          path: dist/android/*-debug-aarch64.apk
          if-no-files-found: error
          retention-days: 7
