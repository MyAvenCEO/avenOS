name: Voice pipeline

on:
  pull_request:
    paths:
      - 'libs/aven-voice-*/**'
      - 'app/src-tauri/src/voice/**'
      - 'app/src-tauri/src/asr/**'
      - 'app/src-tauri/src/tts/**'
      - 'app/src-tauri/src/lib.rs'
      - 'app/src-tauri/Cargo.toml'
      - 'app/src-tauri/tauri.conf.json'
      - 'app/src/lib/voice/**'
      - 'app/src/lib/asr/**'
      - 'app/src/lib/tts/**'
      - 'app/src/lib/actors/listener.actor.svelte.ts'
      - 'app/src/lib/chat/anonymous-speaker.ts'
      - 'app/tests/voice-*.test.ts'
      - 'app/tests/anonymous-speaker.test.ts'
      - 'app/tests/chat-barge-in.test.ts'
      - 'scripts/fetch-onnxruntime.ts'
      - 'scripts/release-next.ts'
      - 'scripts/set-version.ts'
      - 'scripts/tauri-ios-asc.ts'
      - 'scripts/run-duplex-voice-lab.ts'
      - '.cargo/**'
      - 'bun.lock'
      - 'app/src-tauri/Cargo.lock'
      - 'package.json'
      - '.github/actions/bun-install/action.yml'
      - '.github/workflows/voice-ci.yml'
  push:
    branches: [main]
    paths:
      - 'libs/aven-voice-*/**'
      - 'app/src-tauri/src/voice/**'
      - 'app/src-tauri/src/asr/**'
      - 'app/src-tauri/src/tts/**'
      - 'app/src-tauri/src/lib.rs'
      - 'app/src-tauri/Cargo.toml'
      - 'app/src-tauri/tauri.conf.json'
      - 'app/src/lib/voice/**'
      - 'app/src/lib/asr/**'
      - 'app/src/lib/tts/**'
      - 'app/src/lib/actors/listener.actor.svelte.ts'
      - 'app/src/lib/chat/anonymous-speaker.ts'
      - 'app/tests/voice-*.test.ts'
      - 'app/tests/anonymous-speaker.test.ts'
      - 'app/tests/chat-barge-in.test.ts'
      - 'scripts/fetch-onnxruntime.ts'
      - 'scripts/release-next.ts'
      - 'scripts/set-version.ts'
      - 'scripts/tauri-ios-asc.ts'
      - 'scripts/run-duplex-voice-lab.ts'
      - '.cargo/**'
      - 'bun.lock'
      - 'app/src-tauri/Cargo.lock'
      - 'package.json'
      - '.github/actions/bun-install/action.yml'
      - '.github/workflows/voice-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: voice-portable-linux
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: bunx biome check scripts/release-next.ts scripts/set-version.ts scripts/tauri-ios-asc.ts
      - name: Verify the release version stamp is idempotent
        run: |
          version="$(node -p "require('./app/package.json').version")"
          bun scripts/set-version.ts "$version"
          git diff --exit-code -- . ':(exclude).npmrc'
      - run: cargo test --locked --manifest-path libs/aven-voice-protocol/Cargo.toml --all-features
      - run: cargo test --locked --manifest-path libs/aven-voice-core/Cargo.toml
      - run: cargo test --locked --manifest-path libs/aven-voice-runtime/Cargo.toml --all-features
      - run: bun test tests/voice-planner.test.ts tests/voice-controller.test.ts tests/anonymous-speaker.test.ts tests/chat-barge-in.test.ts
        working-directory: app
      - name: Enforce portable crate boundaries
        run: |
          if rg 'cfg\((target_os|target_arch|target_family)|\b(cpal|tauri)::' \
            libs/aven-voice-protocol/src libs/aven-voice-core/src libs/aven-voice-runtime/src; then
            echo 'platform-specific code crossed a portable voice crate boundary'
            exit 1
          fi

  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: voice-host-linux
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev \
            build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2
      - run: cargo test --locked --manifest-path libs/aven-voice-host-cpal/Cargo.toml --features duplex-lab
      - run: AVEN_SPEECH_GPU=cpu bun scripts/fetch-onnxruntime.ts
      - run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml

  apple-host:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: voice-host-macos-ios
      - run: cargo test --locked --manifest-path libs/aven-voice-host-cpal/Cargo.toml --features cpal-host
      - run: cargo check --locked --manifest-path libs/aven-voice-host-cpal/Cargo.toml --features cpal-host --target aarch64-apple-ios
