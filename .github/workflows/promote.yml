name: promote

# Branch model: main → next → prod. Promotions are strict fast-forwards pushed over the
# deploy key (the only ruleset bypass actor), so every branch in the chain always sits on
# an identical commit — GitHub's "rebase and merge" would rewrite SHAs and break that.
# Promoting main → next also triggers release-next (CalVer cut + main sync).

on:
  workflow_dispatch:
    inputs:
      promotion:
        description: Which promotion to run
        type: choice
        required: true
        options:
          - main → next
          - next → prod

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: ${{ inputs.promotion }}
    runs-on: ubuntu-latest
    steps:
      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward push
        env:
          PROMOTION: ${{ inputs.promotion }}
        run: |
          set -euo pipefail
          case "$PROMOTION" in
            "main → next") from=main; to=next ;;
            "next → prod") from=next; to=prod ;;
            *) echo "unknown promotion: $PROMOTION" >&2; exit 1 ;;
          esac
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git fetch origin "$from" "$to"
          src=$(git rev-parse "origin/$from"); dst=$(git rev-parse "origin/$to")
          if [ "$src" = "$dst" ]; then
            echo "$to is already at $src — nothing to promote"; exit 0
          fi
          if ! git merge-base --is-ancestor "$dst" "$src"; then
            echo "::error::$to ($dst) is not an ancestor of $from ($src) — refusing a non-fast-forward promotion" >&2
            exit 1
          fi
          echo "promoting $from → $to: $dst..$src"
          git log --oneline "$dst..$src"
          git push origin "$src:refs/heads/$to"
