name: Client installers

# Explicit, native builds from the protected main source.
# No infrastructure, customer, or recovery credentials enter these jobs.
on:
  workflow_dispatch:
    inputs:
      target:
        description: API destination embedded in the client artifact
        type: choice
        options: [next, production]
        required: true
        default: next

env:
  CLIENT_RELEASE_TARGET: ${{ inputs.target }}

permissions:
  contents: read
  packages: read

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      date: ${{ steps.plan.outputs.date }}
      api: ${{ steps.plan.outputs.api }}
      android_code: ${{ steps.plan.outputs.android_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Audit the locked dependencies before building installers
        run: bun audit
      - id: plan
        name: Require protected source and identify every installer
        run: |
          bun -e '
            import { clientReleasePlan } from "./scripts/lib/client-release.ts";
            import { appendFileSync } from "node:fs";
            const commit = Bun.spawnSync(["git", "show", "-s", "--format=%cs", process.env.GITHUB_SHA]);
            if (commit.exitCode) throw new Error("Cannot read the source commit date");
            const date = commit.stdout.toString().trim();
            const p = clientReleasePlan(process.env.GITHUB_REF, process.env.GITHUB_SHA, process.env.GITHUB_RUN_NUMBER, date, process.env.CLIENT_RELEASE_TARGET);
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${p.version}\ntag=${p.tag}\ndate=${date}\napi=${p.apiOrigin}\nandroid_code=${p.androidVersionCode}\n`);
          '

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CLIENT_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      CLIENT_ANDROID_VERSION_CODE: ${{ needs.plan.outputs.android_code }}
      AVEN_API_BASE_URL: ${{ needs.plan.outputs.api }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Select the Swift 6.1-compatible Mac toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: client-${{ matrix.platform }}-release
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup-client-linux.sh
      - name: Build the native installers with locked Rust dependencies
        run: bun scripts/build-client-release.ts "$CLIENT_PLATFORM"
        env:
          CLIENT_PLATFORM: ${{ matrix.platform }}
      - name: Verify Linux packages and bundled runtime
        if: runner.os == 'Linux'
        run: bash scripts/verify-client-linux.sh
      - name: Verify Mac disk image and ad-hoc application signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          image=(dist/client-release/*.dmg)
          hdiutil verify "${image[0]}"
          mount="$RUNNER_TEMP/client-dmg"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${image[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/avenOS.app"
      - name: Retain failed Linux packages for reproduction
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-linux-packages
          path: |
            dist/client-release/*.AppImage
            dist/client-release/*.deb
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.platform }}
          path: dist/client-release/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      CLIENT_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      CLIENT_ANDROID_VERSION_CODE: ${{ needs.plan.outputs.android_code }}
      AVEN_API_BASE_URL: ${{ needs.plan.outputs.api }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
            app/src-tauri/gen/android/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: client-android-arm64-debug
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" bun scripts/build-client-release.ts android-arm64
      - name: Verify signature, alignment, ABI, package identity, and version
        run: |
          set -euo pipefail
          apk=(dist/client-release/*-debug.apk)
          test "${#apk[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apk[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "${apk[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apk[0]}" > "$RUNNER_TEMP/apk-info.txt"
          grep -q "package: name='ceo.aven.os'" "$RUNNER_TEMP/apk-info.txt"
          grep -q "versionCode='$CLIENT_ANDROID_VERSION_CODE'" "$RUNNER_TEMP/apk-info.txt"
          grep -q "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-info.txt"
          grep -q "sdkVersion:'28'" "$RUNNER_TEMP/apk-info.txt"
          unzip -Z1 "${apk[0]}" > "$RUNNER_TEMP/apk-files.txt"
          if grep -E '^assets/onnxruntime/(lib|ONNXRuntime-)' "$RUNNER_TEMP/apk-files.txt"; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: client-android-arm64
          path: dist/client-release/*-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      CLIENT_RELEASE_DATE: ${{ needs.plan.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: dist/client-release
          merge-multiple: true
      - name: Require all installers and record their checksums and source
        run: bun scripts/client-release-manifest.ts
      - name: Publish one complete prerelease, never a source-only release
        run: |
          set -euo pipefail
          # Never overwrite a published release on retry. Failed uploads remain a
          # draft with a source commit that must match this immutable workflow.
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/client-release.json" 2>/dev/null; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/client-release.json"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "avenOS $RELEASE_TAG · test installers" --notes-file docs/operations/client-preview-notes.md
          fi
          # A pre-existing tag must not redirect the source archives elsewhere.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/client-tag.json" 2> "$RUNNER_TEMP/client-tag-error.txt"; then
            jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' "$RUNNER_TEMP/client-tag.json"
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/client-tag-error.txt" || { cat "$RUNNER_TEMP/client-tag-error.txt" >&2; exit 1; }
          fi
          gh release upload "$RELEASE_TAG" dist/client-release/* --clobber
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/client-uploaded.json"
          bun -e '
            const manifest = await Bun.file("dist/client-release/client-release.json").json();
            const uploaded = (await Bun.file(`${process.env.RUNNER_TEMP}/client-uploaded.json`).json()).assets;
            const expected = [...manifest.assets, ...await Promise.all(["SHA256SUMS", "client-release.json"].map(async name => ({ name, bytes: (await Bun.file(`dist/client-release/${name}`).arrayBuffer()).byteLength })))];
            if (uploaded.length !== expected.length || expected.some(f => !uploaded.some(a => a.name === f.name && a.size === f.bytes && a.state === "uploaded"))) throw new Error("Release uploads are incomplete");
          '
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
