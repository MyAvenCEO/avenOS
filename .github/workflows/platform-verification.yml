name: platform-verification

# Both PR checks and release builds call this complete gate at their exact checkout.
on:
  workflow_call:
    inputs:
      manifest:
        type: string
        required: false
        default: ""
    secrets:
      PACKAGE_READ_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  client-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # This verifies packaging before promotion; it never publishes a release.
      CLIENT_RELEASE_VERSION: 0.0.0-next.1
      CLIENT_ANDROID_VERSION_CODE: '30000001'
      AVEN_API_BASE_URL: https://api.next.aven.ceo
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: client-linux-x64-release
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: bash scripts/setup-client-linux.sh
      - run: bun scripts/build-client-release.ts linux-x64
      - run: bash scripts/verify-client-linux.sh
      - name: Retain failed packages for reproduction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-linux-package-check
          path: |
            dist/client-release/*.AppImage
            dist/client-release/*.deb
          if-no-files-found: ignore
          retention-days: 1

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - uses: ./.github/actions/setup-security-audit
      - name: Static checks
        run: |
          bun test scripts/lib/bun-install-action.test.ts
          bun run check:secrets
          bun audit
          bun run check:rust-advisories
          bun run check:docs
          bun run check
          bun run check:identity
          bun run check:api
          bun run check:checkout
          bun run --cwd libs/aven-identity check
          bun run --cwd libs/aven-hosting check
          bun run --cwd services/static-site-host check
          bun run --cwd libs/aven-customer-contracts check
          bun run --cwd libs/aven-customer-runtime check
          bun run --cwd libs/aven-actors check
          bun run --cwd libs/aven-artifact-store check
          bun run --cwd libs/aven-document-ingest check
          bun run --cwd libs/aven-llm-client check
          bun run --cwd services/platform-provisioner check
          bun run --cwd services/intent-service check
          bun run --cwd services/actor-runner check
      - name: Production builds
        run: |
          bun run --cwd app build
          bun run build:identity
          bun run build:api
          bun run build:checkout
          bun run --cwd services/platform-provisioner build
          bun run --cwd services/intent-service build
          bun run --cwd services/actor-runner build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      checkout-postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: aven-dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> ../../target/rust
            services/artifact-store -> ../../target/rust
          key: platform-linux
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: ./.github/actions/setup-platform-test-host
        with:
          browser-e2e: 'false'
      - name: Test app integration
        run: bun test
        working-directory: app
      - name: Unit and infrastructure tests
        run: |
          bun run test:identity
          bun run test:api
          bun run test:checkout
          bun run --cwd libs/aven-identity test
          bun run --cwd libs/aven-hosting test
          bun run --cwd services/static-site-host test
          bun run --cwd libs/aven-customer-contracts test
          bun run --cwd libs/aven-customer-runtime test
          bun run --cwd libs/aven-actors test
          bun run --cwd libs/aven-artifact-store test
          bun run --cwd libs/aven-document-ingest test
          cargo test --locked --release --manifest-path app/src-tauri/Cargo.toml --lib service_token::tests
          cargo test --locked --workspace --manifest-path services/artifact-store/Cargo.toml
          bun run --cwd services/platform-provisioner test
          bun run --cwd services/intent-service test
          bun run --cwd services/actor-runner test

  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - name: Validate shell and Compose sources
        run: bun run test:deploy
      - run: bun run test:proxy-boundary
      - name: Prove individual customer migration and rollback
        run: bun run test:customer-movement
      - name: Prove real service migration and rollback
        run: bun run test:customer-runtime
      - name: Prove retained release recovery without registry access
        run: bun run test:release-archive
      - name: Build and drill database recovery image
        run: bun run test:recovery

  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> ../../target/rust
            services/artifact-store -> ../../target/rust
          key: platform-linux
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: ./.github/actions/setup-platform-test-host
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the exact release images when verifying a release
        env:
          RELEASE_TEST_MANIFEST: ${{ inputs.manifest }}
        run: bun scripts/configure-e2e-release.ts
      - name: Full-stack browser E2E
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
        run: xvfb-run --auto-servernum bun run test:e2e:native

  runtime:
    runs-on: ubuntu-latest
    # Fleet image archives and fixture cleanup vary with hosted-runner disk speed.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the exact release images when verifying a release
        env:
          RELEASE_TEST_MANIFEST: ${{ inputs.manifest }}
        run: bun scripts/configure-e2e-release.ts
      - name: Prove host rollout and fresh encrypted fleet recovery
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
        run: bun run test:e2e:runtime
