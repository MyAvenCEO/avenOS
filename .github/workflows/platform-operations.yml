name: platform-operations

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: next
    concurrency:
      group: aven-platform-operations-next
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.PULUMI_STATE_S3_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.PULUMI_STATE_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK }}
      PULUMI_BACKEND: s3://${{ vars.PULUMI_STATE_S3_BUCKET }}/avenos/platform?endpoint=${{ vars.PULUMI_STATE_S3_REGION }}.your-objectstorage.com&region=${{ vars.PULUMI_STATE_S3_REGION }}&s3ForcePathStyle=true&awssdk=v2
    steps:
      - uses: actions/checkout@v5
      - name: Detect first successful new-platform deployment
        id: activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          active=false
          while read -r sha; do
            [[ -n "$sha" ]] || continue
            if gh api "repos/$GITHUB_REPOSITORY/contents/deploy/operations/Dockerfile?ref=$sha" >/dev/null 2>&1; then
              active=true
              break
            fi
          done < <(gh run list --workflow platform-deploy.yml --status success --limit 20 --json headSha --jq '.[].headSha')
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [[ "$active" != true ]]; then
            echo 'The fresh platform has not completed its first deployment; scheduled monitoring is dormant.'
          fi
      - name: Install Pulumi CLI
        if: steps.activation.outputs.active == 'true'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
      - name: Check public service health
        if: steps.activation.outputs.active == 'true'
        run: |
          curl --fail --show-error --silent --max-time 20 https://aven.id/api/health/ready
          curl --fail --show-error --silent --max-time 20 https://api.aven.ceo/health/live
          curl --fail --show-error --silent --max-time 20 https://my.aven.ceo/api/health/ready
          curl --fail --show-error --silent --max-time 20 https://aven.ceo/ >/dev/null
      - name: Check host disk and backup health
        if: steps.activation.outputs.active == 'true'
        run: |
          ./tools/stack-observe/run.sh identity check
          ./tools/stack-observe/run.sh platform check
