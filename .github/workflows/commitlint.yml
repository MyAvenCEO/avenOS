name: commitlint

# Enforce conventional commits in the source history used for release notes.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  commitlint:
    name: lint main commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - name: Lint pushed commit range
        run: bunx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
