name: commitlint

# Enforce conventional commits in the source history used for release notes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: lint commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.PACKAGE_READ_TOKEN }}
      - name: Lint commit range
        env:
          COMMIT_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$COMMIT_FROM" =~ ^[0-9a-f]{40}$ && "$COMMIT_TO" =~ ^[0-9a-f]{40}$ ]]
          bunx commitlint --from "$COMMIT_FROM" --to "$COMMIT_TO" --verbose
