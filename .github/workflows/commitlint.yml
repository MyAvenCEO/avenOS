name: commitlint

# Enforce conventional commits so the CalVer changelog stays clean and grouped. Scoped to `next`
# pushes ONLY — CI must never trigger on feature branches or PRs (matches release-next). board 0062.

on:
  push:
    branches: [next]

permissions:
  contents: read
  packages: read

jobs:
  commitlint:
    name: lint next commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint pushed commit range
        run: bunx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
