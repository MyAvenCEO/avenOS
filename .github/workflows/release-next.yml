            fi
          done
          install -m 700 -d "$RUNNER_TEMP/identity-deploy/deploy"
          install -m 644 services/aven-api/docker-compose.yml "$RUNNER_TEMP/identity-deploy/docker-compose.yml"
          install -m 644 services/aven-api/docker-compose.deploy.yml "$RUNNER_TEMP/identity-deploy/docker-compose.deploy.yml"
          install -m 644 services/aven-api/docker-compose.artifact-store.deploy.yml "$RUNNER_TEMP/identity-deploy/docker-compose.artifact-store.deploy.yml"
          install -m 755 services/aven-api/deploy/db-init.sh "$RUNNER_TEMP/identity-deploy/deploy/db-init.sh"
          install -m 755 services/aven-api/deploy/rollback-previous.sh "$RUNNER_TEMP/identity-deploy/deploy/rollback-previous.sh"
          install -m 644 services/aven-api/deploy/Caddyfile "$RUNNER_TEMP/identity-deploy/deploy/Caddyfile"
          install -m 600 /dev/null "$RUNNER_TEMP/identity-deploy/.env"
          {
            printf 'NODE_ENV=production\n'
            printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
            printf 'IDENTITY_DOMAIN=%s\n' "$IDENTITY_DOMAIN"
            printf 'WEBAUTHN_RP_ID=%s\n' "$WEBAUTHN_RP_ID"
            printf 'DOWNLOAD_URL=%s\n' "$DOWNLOAD_URL"
            printf 'SMTP_FROM=%s\n' "$SMTP_FROM"
            printf 'NAME_PRICE_EUR=%s\n' "$NAME_PRICE_EUR"
            printf 'DOCKER_LOG_MAX_SIZE=%s\n' "$DOCKER_LOG_MAX_SIZE"
            printf 'DOCKER_LOG_MAX_FILE=%s\n' "$DOCKER_LOG_MAX_FILE"
            printf 'DOCKER_LOG_COMPRESS=%s\n' "$DOCKER_LOG_COMPRESS"
            printf 'APPLICATION_VERSION=%s\n' "$VERSION"
            printf 'AVEN_API_IMAGE=%s\n' "$IMAGE"
            printf 'AVEN_ARTIFACT_STORE_IMAGE=%s\n' "$ARTIFACT_IMAGE"
            printf 'AVEN_INTENT_SERVICE_IMAGE=%s\n' "$INTENT_IMAGE"
            printf 'AVEN_STATIC_SITE_HOST_IMAGE=%s\n' "$SITE_HOST_IMAGE"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'EMAIL_QUEUE_ENCRYPTION_KEY=%s\n' "$EMAIL_QUEUE_ENCRYPTION_KEY"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'AVEN_MIGRATOR_PASSWORD=%s\n' "$AVEN_MIGRATOR_PASSWORD"
            printf 'AVEN_SERVER_PASSWORD=%s\n' "$AVEN_SERVER_PASSWORD"
            printf 'AVEN_EMAIL_WORKER_PASSWORD=%s\n' "$AVEN_EMAIL_WORKER_PASSWORD"
            printf 'AVEN_ENVIRONMENT_WORKER_PASSWORD=%s\n' "$AVEN_ENVIRONMENT_WORKER_PASSWORD"
            printf 'AVEN_PROVISIONER_PASSWORD=%s\n' "$AVEN_PROVISIONER_PASSWORD"
            printf 'SITE_HOST_DIRECTORY_BEARER_TOKEN=%s\n' "$SITE_HOST_DIRECTORY_BEARER_TOKEN"
            printf 'SITE_HOST_ALLOWED_IPV4=%s\n' "$SITE_HOST_ALLOWED_IPV4"
            printf 'SITE_HOST_ALLOWED_IPV6=%s\n' "$SITE_HOST_ALLOWED_IPV6"
            printf 'SITE_HOST_POLL_SECONDS=%s\n' "${SITE_HOST_POLL_SECONDS:-60}"
            printf 'SITE_HOST_DNS_GRACE_SECONDS=%s\n' "${SITE_HOST_DNS_GRACE_SECONDS:-86400}"
            printf 'SITE_HOST_MAX_FILES=%s\n' "${SITE_HOST_MAX_FILES:-10000}"
            printf 'SITE_HOST_MAX_BYTES=%s\n' "${SITE_HOST_MAX_BYTES:-268435456}"
            printf 'SITE_HOST_MAX_CONCURRENT_SYNCS=%s\n' "${SITE_HOST_MAX_CONCURRENT_SYNCS:-4}"
            printf 'ARTIFACT_STORE_BEARER_TOKEN=%s\n' "$ARTIFACT_STORE_BEARER_TOKEN"
            printf 'ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN=%s\n' "$ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN"
            printf 'ARTIFACT_STORE_RUNTIME_PASSWORD=%s\n' "$ARTIFACT_STORE_RUNTIME_PASSWORD"
            printf 'ARTIFACT_STORE_MAX_TENANT_POOLS=%s\n' "${ARTIFACT_STORE_MAX_TENANT_POOLS:-64}"
            printf 'ARTIFACT_STORE_CONNECTIONS_PER_TENANT=%s\n' "${ARTIFACT_STORE_CONNECTIONS_PER_TENANT:-2}"
            printf 'ARTIFACT_STORE_MEMORY_LIMIT=%s\n' "$ARTIFACT_STORE_MEMORY_LIMIT"
            printf 'ARTIFACT_STORE_MAX_UPLOAD_BYTES=%s\n' "$ARTIFACT_STORE_MAX_UPLOAD_BYTES"
            printf 'ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS=%s\n' "$ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS"
            printf 'ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE=%s\n' "$ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE"
            printf 'ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE=%s\n' "$ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE"
            printf 'ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE=%s\n' "$ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE"
            printf 'ARTIFACT_PROCESSOR_BEARER_TOKEN=%s\n' "$ARTIFACT_PROCESSOR_BEARER_TOKEN"
            printf 'ARTIFACT_PROCESSOR_DIRECTORY_BEARER_TOKEN=%s\n' "$ARTIFACT_PROCESSOR_DIRECTORY_BEARER_TOKEN"
            printf 'ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN=%s\n' "$ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN"
            printf 'ARTIFACT_PROCESSOR_RUNTIME_PASSWORD=%s\n' "$ARTIFACT_PROCESSOR_RUNTIME_PASSWORD"
            printf 'ARTIFACT_PROCESSOR_MAX_TENANT_POOLS=%s\n' "$ARTIFACT_PROCESSOR_MAX_TENANT_POOLS"
            printf 'ARTIFACT_PROCESSOR_CONNECTIONS_PER_TENANT=%s\n' "$ARTIFACT_PROCESSOR_CONNECTIONS_PER_TENANT"
            printf 'ARTIFACT_PROCESSOR_TENANT_REFRESH_SECONDS=%s\n' "$ARTIFACT_PROCESSOR_TENANT_REFRESH_SECONDS"
            printf 'ARTIFACT_PROCESSOR_MEMORY_LIMIT=%s\n' "$ARTIFACT_PROCESSOR_MEMORY_LIMIT"
            printf 'ARTIFACT_PROCESSOR_VISION_ENABLED=%s\n' "$ARTIFACT_PROCESSOR_VISION_ENABLED"
            printf 'ARTIFACT_PROCESSOR_VISION_BASE_URL=%s\n' "$ARTIFACT_PROCESSOR_VISION_BASE_URL"
            printf 'ARTIFACT_PROCESSOR_VISION_MODEL=%s\n' "$ARTIFACT_PROCESSOR_VISION_MODEL"
            printf 'ARTIFACT_PROCESSOR_VISION_PROFILE=%s\n' "$ARTIFACT_PROCESSOR_VISION_PROFILE"
            printf 'ARTIFACT_PROCESSOR_VISION_AUTH_MODE=%s\n' "$ARTIFACT_PROCESSOR_VISION_AUTH_MODE"
            printf 'ARTIFACT_PROCESSOR_VISION_API_KEY=%s\n' "$ARTIFACT_PROCESSOR_VISION_API_KEY"
            printf 'ARTIFACT_PROCESSOR_VISION_MAX_PAGES=%s\n' "$ARTIFACT_PROCESSOR_VISION_MAX_PAGES"
            printf 'ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS=%s\n' "$ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS"
            printf 'INTENT_SERVICE_BEARER_TOKEN=%s\n' "$INTENT_SERVICE_BEARER_TOKEN"
            printf 'INTENT_SERVICE_DIRECTORY_BEARER_TOKEN=%s\n' "$INTENT_SERVICE_DIRECTORY_BEARER_TOKEN"
            printf 'INTENT_SERVICE_PROVISIONER_BEARER_TOKEN=%s\n' "$INTENT_SERVICE_PROVISIONER_BEARER_TOKEN"
            printf 'INTENT_SERVICE_RUNTIME_PASSWORD=%s\n' "$INTENT_SERVICE_RUNTIME_PASSWORD"
            printf 'INTENT_SERVICE_PROCESSOR_BEARER_TOKEN=%s\n' "$INTENT_SERVICE_PROCESSOR_BEARER_TOKEN"
            printf 'INTENT_SERVICE_MAX_TENANT_POOLS=%s\n' "$INTENT_SERVICE_MAX_TENANT_POOLS"
            printf 'INTENT_SERVICE_CONNECTIONS_PER_TENANT=%s\n' "$INTENT_SERVICE_CONNECTIONS_PER_TENANT"
            printf 'INTENT_SERVICE_TENANT_REFRESH_SECONDS=%s\n' "$INTENT_SERVICE_TENANT_REFRESH_SECONDS"
            printf 'INTENT_SERVICE_MEMORY_LIMIT=%s\n' "$INTENT_SERVICE_MEMORY_LIMIT"
            printf 'SMTP_URL=%s\n' "$SMTP_URL"
            printf 'POLAR_API_KEY=%s\n' "$POLAR_API_KEY"
            printf 'POLAR_SERVER=%s\n' "$POLAR_SERVER"
            printf 'POLAR_WEBHOOK_SECRET=%s\n' "$POLAR_WEBHOOK_SECRET"
          } > "$RUNNER_TEMP/identity-deploy/.env"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Install and start immutable stack
        env:
          DEPLOY_HOST: ${{ needs.deploy-identity-infrastructure-next.outputs.deploy-host }}
          DEPLOY_USER: ${{ needs.deploy-identity-infrastructure-next.outputs.deploy-user }}
          GHCR_USER: ${{ vars.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh_args=(-i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o ConnectTimeout=5 -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          upload="/tmp/aven-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ready=false
          for _ in $(seq 1 120); do
            if ssh "${ssh_args[@]}" "$remote" "test -f /var/lib/aven/cloud-init-complete"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "::error::The host did not finish cloud-init within ten minutes."
            exit 1
          fi
          # The generated upload path is intentionally expanded by this runner.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$remote" "install -m 700 -d '$upload'"
          scp "${ssh_args[@]}" -r "$RUNNER_TEMP/identity-deploy/." "$remote:$upload/"
          # The configured registry username is intentionally expanded by this runner.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_READ_TOKEN" | ssh "${ssh_args[@]}" "$remote" "sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # Compose waits only for services with container healthchecks. The workers
          # deliberately use database heartbeats and are verified by /api/health/status below.
          # The generated upload path is intentionally expanded by this runner.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$remote" "sudo install -m 700 -d /opt/aven-api/deploy /opt/aven-api/previous && sudo install -d -o 10003 -g 10003 -m 0750 /var/lib/aven/static-sites && if sudo test -f /opt/aven-api/.env; then sudo install -m 600 /opt/aven-api/.env /opt/aven-api/previous/.env && sudo install -m 644 /opt/aven-api/docker-compose.yml /opt/aven-api/docker-compose.deploy.yml /opt/aven-api/docker-compose.artifact-store.deploy.yml /opt/aven-api/previous/; fi && sudo install -m 600 '$upload/.env' /opt/aven-api/.env && sudo install -m 644 '$upload/docker-compose.yml' '$upload/docker-compose.deploy.yml' '$upload/docker-compose.artifact-store.deploy.yml' /opt/aven-api/ && sudo install -m 644 '$upload/deploy/Caddyfile' /opt/aven-api/deploy/Caddyfile && sudo install -m 755 '$upload/deploy/db-init.sh' '$upload/deploy/rollback-previous.sh' /opt/aven-api/deploy/ && cd /opt/aven-api && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml pull && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml up -d --wait --wait-timeout 120 db && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'GRANT pg_signal_backend TO aven_provisioner' && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml run --rm migrator && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml up -d --no-deps --wait --wait-timeout 180 artifact-store-provisioner artifact-processor-provisioner intent-service-provisioner && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml up -d --no-deps environment-worker && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml up -d --no-deps --wait --wait-timeout 180 artifact-store app artifact-processor intent-service static-site-host caddy && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml up -d --no-deps email-worker && rm -rf '$upload'"

      - name: Dump container logs on failure
        if: failure()
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ needs.deploy-identity-infrastructure-next.outputs.deploy-host }}
          DEPLOY_USER: ${{ needs.deploy-identity-infrastructure-next.outputs.deploy-user }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          # The crash that made a service unhealthy is only visible inside the
          # containers — surface it in CI so nobody needs SSH to diagnose.
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o ConnectTimeout=5 -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/aven-api && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml ps && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.artifact-store.deploy.yml logs --no-color --tail=120 migrator app static-site-host caddy"

      - name: Remove temporary host upload
        if: always()
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ needs.deploy-identity-infrastructure-next.outputs.deploy-host }}
          DEPLOY_USER: ${{ needs.deploy-identity-infrastructure-next.outputs.deploy-user }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o ConnectTimeout=5 -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '/tmp/aven-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Verify deployment
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors "$PUBLIC_BASE_URL/api/health/ready"
          overall=""
          for _ in $(seq 1 100); do
            overall="$(curl --fail --silent "$PUBLIC_BASE_URL/api/health/status" | jq -r .overall || true)"
            [ "$overall" = "healthy" ] && break
            sleep 3
          done
          test "$overall" = "healthy"
          curl --fail "$PUBLIC_BASE_URL/api/meta"
          curl --fail "$PUBLIC_BASE_URL/.well-known/apple-app-site-association"
          device_grant="$(curl --fail --silent --show-error \
            -X POST "$PUBLIC_BASE_URL/api/auth/device/code" \
            -H 'content-type: application/json' \
            --data '{"client_id":"ceo.aven.os"}')"
          verification_uri="$(jq -r .verification_uri_complete <<<"$device_grant")"
          [[ "$verification_uri" == "$PUBLIC_BASE_URL/device?user_code="* ]]
          curl --fail --silent --show-error "$verification_uri" >/dev/null

  release-macos:
    name: macOS build → TestFlight
    needs: [release, deploy-identity-next]
    runs-on: macos-15 # Apple Silicon (free on public repos); builds the aarch64 .app
    # Scoped to `next` so the build can bake the next-channel Google OAuth creds into the
    # binary. Apple credentials are REPOSITORY secrets (cross-channel — signing next AND main);
    # repo secrets stay available inside an environment-scoped job, so this is additive.
    environment: next
    steps:
      - name: Checkout next at the release commit (full history + tags)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture the full release version (incl. -next.N) for the in-app version row
        # Read it BEFORE the next step strips -next.N out of package.json for the App Store; the
        # tauri/vite build bakes PUBLIC_APP_VERSION into the Profile "App version" row. board 0061.
        run: echo "PUBLIC_APP_VERSION=$(node -p 'require("./app/package.json").version')" >> "$GITHUB_ENV"

      - name: Set marketing version to the stable CalVer (strip -next.N for App Store)
        # Apple rejects non-numeric CFBundleShortVersionString, so the app ships the stable
        # CalVer (e.g. 26.6.1) as its marketing version; github.run_number is the unique
        # CFBundleVersion that distinguishes the many -next.N builds under it.
        run: bun run set-version "$(bun run --silent next-version)"

      - name: Cache Rust build (warm deps reused across runs)
        uses: Swatinem/rust-cache@v2
        with:
          # All cargo builds redirect to repo-root target/rust via .cargo/config.toml.
          workspaces: app/src-tauri -> ../../target/rust
          key: macos

      - name: Import signing certs into a temporary keychain
        # One combined .p12 carries both signing identities (Apple Distribution → codesign
        # the .app; 3rd Party Mac Developer Installer → productbuild the .pkg) plus their keys.
        env:
          CERTS_P12_B64: ${{ secrets.APPLE_CERTS_P12_BASE64 }}
          CERTS_P12_PW: ${{ secrets.APPLE_CERTS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/aven-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERTS_P12_B64" | base64 -d > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$CERTS_P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certs.p12"

      - name: Materialize provisioning profile + App Store Connect API key
        env:
          PROFILE_B64: ${{ secrets.MACOS_PROVISIONPROFILE_BASE64 }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/apple/mac-app-store.provisionprofile"
          echo "$API_KEY_B64" | base64 -d > "$RUNNER_TEMP/apple/AuthKey_${APPLE_API_KEY}.p8"
          # altool requires the key file named AuthKey_<KEYID>.p8 (release-app.ts checks this).
          {
            echo "AVEN_APP_STORE_PROVISIONING_PROFILE_MACOS=$RUNNER_TEMP/apple/mac-app-store.provisionprofile"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple/AuthKey_${APPLE_API_KEY}.p8"
          } >> "$GITHUB_ENV"

      - name: Build signed .pkg + upload to TestFlight
        # CFBundleVersion = the -next.N counter from this release's tag, so the TestFlight
        # build number matches the GitHub release (v…-next.32 → build 32). N resets only when
        # the marketing version (YY.M.MICRO, set above) changes, so it's strictly increasing
        # per marketing version — exactly what Apple requires.
        run: |
          BUILD_NUMBER="$(git describe --tags --match 'v*-next.*' --abbrev=0 | sed -E 's/^.*-next\.//')"
          echo "build number = $BUILD_NUMBER (from $(git describe --tags --match 'v*-next.*' --abbrev=0))"
          bun run release:app:mac "$BUILD_NUMBER"
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AVEN_PKG_INSTALLER_IDENTITY: ${{ secrets.AVEN_PKG_INSTALLER_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Point both the web bundle and native Rust device flow at the deployed identity API.
          PUBLIC_BETTER_AUTH_URL: ${{ vars.PUBLIC_BASE_URL }}
          AVEN_IDENTITY_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          # Bake the native-sign-in Google Desktop client into the Rust binary (network.rs
          # option_env!), so the shipped app has it without a process env. Must be the SAME
          # client the auth server verifies the idToken audience against.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  release-ios:
    name: iOS build → TestFlight
    needs: [release, deploy-identity-next]
    runs-on: macos-15 # Apple Silicon; builds the aarch64-apple-ios .ipa
    # Scoped to `next` to bake the next-channel Google OAuth creds (additive — repo Apple
    # secrets stay available). Reuses the same repository Apple secrets as the macOS job.
    environment: next
    steps:
      - name: Checkout next at the release commit (full history + tags)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture the full release version (incl. -next.N) for the in-app version row
        # Read it BEFORE the next step strips -next.N out of package.json for the App Store; the
        # tauri/vite build bakes PUBLIC_APP_VERSION into the Profile "App version" row. board 0061.
        run: echo "PUBLIC_APP_VERSION=$(node -p 'require("./app/package.json").version')" >> "$GITHUB_ENV"

      - name: Set marketing version to the stable CalVer (strip -next.N for App Store)
        run: bun run set-version "$(bun run --silent next-version)"

      - name: Select latest Xcode (App Store requires the iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Add the iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust build (warm deps reused across runs)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: ios

      - name: Materialize signing cert + iOS provisioning profile + API key
        # tauri-ios-asc.ts (manual CI signing) reads these PATHS and lets Tauri import the
        # cert into a keychain via IOS_CERTIFICATE — so no manual keychain step is needed here.
        env:
          CERTS_P12_B64: ${{ secrets.APPLE_CERTS_P12_BASE64 }}
          IOS_PROFILE_B64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple"
          echo "$CERTS_P12_B64" | base64 -d > "$RUNNER_TEMP/apple/certs.p12"
          echo "$IOS_PROFILE_B64" | base64 -d > "$RUNNER_TEMP/apple/app.mobileprovision"
          echo "$API_KEY_B64" | base64 -d > "$RUNNER_TEMP/apple/AuthKey_${APPLE_API_KEY}.p8"
          {
            echo "APPLE_CERTS_P12=$RUNNER_TEMP/apple/certs.p12"
            echo "AVEN_IOS_APP_STORE_MOBILEPROVISION=$RUNNER_TEMP/apple/app.mobileprovision"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple/AuthKey_${APPLE_API_KEY}.p8"
          } >> "$GITHUB_ENV"

      - name: Generate the iOS Xcode project (gen/apple is not committed)
        working-directory: app
        run: CI=true bunx tauri ios init --ci

      - name: Import signing cert into a temporary keychain
        # The archive is signed via Tauri's transient IOS_CERTIFICATE keychain, but the
        # separate `xcodebuild -exportArchive` needs the Apple Distribution cert in a default
        # keychain too — else "No signing certificate 'iOS Distribution' found".
        env:
          CERTS_P12_B64: ${{ secrets.APPLE_CERTS_P12_BASE64 }}
          CERTS_P12_PW: ${{ secrets.APPLE_CERTS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/aven-ios-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERTS_P12_B64" | base64 -d > "$RUNNER_TEMP/ios-certs.p12"
          security import "$RUNNER_TEMP/ios-certs.p12" -k "$KEYCHAIN" -P "$CERTS_P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/ios-certs.p12"

      - name: Build signed .ipa + upload to TestFlight
        # CFBundleVersion = the -next.N counter from this release's tag (matches the GitHub
        # release; strictly increasing per marketing version — see the macOS job).
        run: |
          BUILD_NUMBER="$(git describe --tags --match 'v*-next.*' --abbrev=0 | sed -E 's/^.*-next\.//')"
          echo "build number = $BUILD_NUMBER (from $(git describe --tags --match 'v*-next.*' --abbrev=0))"
          bun run release:app:ios "$BUILD_NUMBER"
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_CERTS_P12_PASSWORD: ${{ secrets.APPLE_CERTS_P12_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Point both the web bundle and native Rust device flow at the deployed identity API.
          PUBLIC_BETTER_AUTH_URL: ${{ vars.PUBLIC_BASE_URL }}
          AVEN_IDENTITY_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          # Bake the native-sign-in Google Desktop client into the Rust binary (network.rs
          # option_env!), so the shipped app has it without a process env. Must be the SAME
          # client the auth server verifies the idToken audience against.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  release-linux:
    name: Linux x86_64 build → release asset
    needs: [release, deploy-identity-next]
    runs-on: ubuntu-latest
    # `next` env for the Google Desktop client (baked into the binary via network.rs option_env!).
    environment: next
    steps:
      - name: Checkout next at the release commit (full history + tags)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux native deps (webkit2gtk, libsoup, AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Cache Rust build (warm deps reused across runs)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> ../../target/rust
          key: linux

      - name: Build the Linux app (.deb + AppImage)
        # Same env baking as the macOS/iOS jobs. APPIMAGE_EXTRACT_AND_RUN avoids the FUSE
        # requirement on the CI runner. No App Store signing — Linux ships via this asset.
        run: bun run build:app:linux
        env:
          PUBLIC_BETTER_AUTH_URL: ${{ vars.PUBLIC_BASE_URL }}
          AVEN_IDENTITY_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Upload the .deb + AppImage to the prerelease
        # Attach to the release the `release` job already created for this tag (the cargo target
        # dir is redirected to target/rust via .cargo/config.toml).
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          shopt -s nullglob
          files=( target/rust/release/bundle/deb/*.deb target/rust/release/bundle/appimage/*.AppImage )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no Linux bundles found under target/rust/release/bundle"
            exit 1
          fi
          echo "uploading to $TAG: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
