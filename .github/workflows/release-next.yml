name: release-next

# CalVer staging channel: validate the identity stack, cut the release, publish
# and deploy its immutable images, then build the signed app artifacts.

on:
  push:
    branches: [next]

concurrency:
  group: release-next
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  identity-validate:
    name: identity stack validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aven-ci
          POSTGRES_DB: aven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d aven"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:aven-ci@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://postgres:aven-ci@127.0.0.1:5432/aven
      PUBLIC_BASE_URL: http://localhost:3000
      WEBAUTHN_RP_ID: localhost
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      EMAIL_QUEUE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - run: bun install --frozen-lockfile
      - run: bunx biome check services/aven-api
      - run: bunx biome check infrastructure/identity
      - run: bunx biome check services/static-site-host
      - run: bunx biome check libs/aven-hosting
      - run: bun run check:api
      - run: bun run test:api
      - run: bun run test:infra
      - run: bun run --cwd services/static-site-host check
      - run: bun run --cwd services/static-site-host test
      - run: bun run --cwd libs/aven-hosting check
      - run: bun run --cwd libs/aven-hosting test
      - run: cargo test --locked --workspace
        working-directory: services/artifact-store
      - run: cargo test --locked
        working-directory: services/intent-service
      - run: bun run db:migrate:api && bun run db:migrate:api
      - run: bun run build:api
      - run: docker build -f services/aven-api/Dockerfile -t aven-api:validation .
      - run: docker build -f services/artifact-store/Dockerfile -t aven-artifact-store:validation .
      - run: docker build -f services/intent-service/Dockerfile -t aven-intent-service:validation .
      - run: docker build -f services/static-site-host/Dockerfile -t aven-static-site-host:validation .

  release:
    name: tag + changelog
    needs: identity-validate
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      # Load the avenOS deploy key (SSH) so the release commit + tag can be pushed to the
      # ruleset-protected `next` (the deploy key is in the ruleset bypass list). The default
      # GITHUB_TOKEN/github-actions[bot] can't be a bypass actor. Pattern mirrors MaiaOS.
      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Don't persist GITHUB_TOKEN for HTTPS push (blocked on protected next) — push via SSH.
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git identity + SSH remote
        run: |
          git config user.name "aven-release-bot"
          git config user.email "release@aven.os"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: Derive CalVer, stamp, changelog, tag, prerelease
        id: release
        # release:next pushes HEAD + the tag (now over SSH via the deploy key) and creates the
        # GitHub prerelease. It skips cleanly when a newer `next` push superseded this run.
        run: bun run release:next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch model: main → next → prod. The release commit above lands on `next` only, which
      # would make the following main → next merge non-fast-forward. Sync it back to `main`
      # right away (over the same ruleset-bypassing deploy key). A normal merge is unsafe here:
      # GitHub may have rebased the same PR independently onto main and next, leaving identical
      # trees with different histories and add/add conflicts in newly version-stamped files.
      - name: Sync release commit back to main
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 "$RELEASE_SHA" | wc -w)" -eq 2
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          release_parent="$(git rev-parse "$RELEASE_SHA^")"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            main_sha="$(git rev-parse origin/main)"

            if git merge-base --is-ancestor "$main_sha" "$RELEASE_SHA"; then
              echo "main fast-forwards to $RELEASE_SHA"
              candidate="$RELEASE_SHA"
            else
              echo "main moved to $main_sha — synthesizing release-only merge (attempt $attempt)"

              # `next` must contain no source patch absent from main. Minus entries are
              # patch-equivalent commits (for example, independently rebased PRs). Plus
              # entries are allowed only for earlier tagged release commits; anything else
              # would mean that an ancestry-only merge could silently lose source.
              cherry="$(git cherry "$main_sha" "$release_parent")"
              while read -r marker sha; do
                [ "$marker" = "+" ] || continue
                commit_tags="$(git tag --points-at "$sha")"
                if ! grep -Ex '^v[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$' <<<"$commit_tags" >/dev/null; then
                  echo "::error::next contains source commit $sha that is not represented on main; refusing automatic release sync."
                  exit 1
                fi
              done <<<"$cherry"

              git switch --detach "$main_sha"
              git merge --strategy=ours --no-ff --no-commit "$RELEASE_SHA"
              bun ./scripts/set-version.ts "${RELEASE_TAG#v}"
              git restore --source="$RELEASE_SHA" -- CHANGELOG.md
              git add -A
              git commit -m "chore(release): sync $RELEASE_TAG into main [skip ci]"
              candidate="$(git rev-parse HEAD)"
            fi

            if git push origin "$candidate:refs/heads/main"; then
              exit 0
            fi
            echo "main advanced during sync; retrying from the new remote head"
          done

          echo "::error::main kept advancing; release sync exhausted five attempts."
          exit 1

  deploy-website:
    # The public marketing site (libs/aven-website) → GitHub Pages, served at next.aven.ceo
    # (static/CNAME). Fully prerendered by adapter-static, so Pages needs no server. Runs on
    # every push to `next` (PR merges); gated only on identity-validate, not on the release.
    name: deploy website (GitHub Pages)
    needs: identity-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build the static site
        run: bun run --cwd libs/aven-website build
      - name: Verify the custom-domain marker survived the build
        run: test "$(cat libs/aven-website/build/CNAME)" = "next.aven.ceo"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: libs/aven-website/build
      - id: deploy
        uses: actions/deploy-pages@v4

  publish-identity-image:
    name: publish identity image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/myavenceo/aven-api
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: services/aven-api/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-api:sha-${{ steps.commit.outputs.sha }}

  publish-artifact-store-image:
    name: publish Artifact Store image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/myavenceo/aven-artifact-store
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: services/artifact-store/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-artifact-store:sha-${{ needs.release.outputs.commit }}

  publish-intent-service-image:
    name: publish Intent Service image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/myavenceo/aven-intent-service
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: services/intent-service/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-intent-service:sha-${{ needs.release.outputs.commit }}

  publish-static-site-host-image:
    name: publish static site host image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/myavenceo/aven-static-site-host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: services/static-site-host/Dockerfile
          push: true
          tags: ghcr.io/myavenceo/aven-static-site-host:sha-${{ needs.release.outputs.commit }}

  deploy-identity-infrastructure-next:
    name: update identity infrastructure
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: next
    concurrency:
      group: identity-infrastructure-next
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      deploy-host: ${{ steps.infrastructure.outputs.ipv4Address }}
      deploy-user: ${{ steps.infrastructure.outputs.deployUser }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:infra
      - name: Validate state backend settings
        env:
          STATE_BUCKET: ${{ vars.PULUMI_STATE_S3_BUCKET }}
          STATE_REGION: ${{ vars.PULUMI_STATE_S3_REGION }}
          STACK_NAME: ${{ vars.PULUMI_STACK }}
        run: |
          set -euo pipefail
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$STATE_BUCKET" != *..* ]]
          test "$STATE_REGION" = "hel1"
          test "$STACK_NAME" = "organization/aven-identity/next"
      - name: Apply infrastructure
        id: infrastructure
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_S3_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PULUMI_STATE_S3_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.PULUMI_STATE_S3_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          HETZNER_COMPUTE_TOKEN: ${{ secrets.HETZNER_COMPUTE_TOKEN }}
          HETZNER_DNS_TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          HETZNER_LOCATION: ${{ vars.HETZNER_LOCATION }}
          HETZNER_SERVER_TYPE: ${{ vars.HETZNER_SERVER_TYPE }}
          HETZNER_SERVER_ARCHITECTURE: ${{ vars.HETZNER_SERVER_ARCHITECTURE }}
          HETZNER_OS_IMAGE: ${{ vars.HETZNER_OS_IMAGE }}
          HETZNER_VOLUME_SIZE_GB: ${{ vars.HETZNER_VOLUME_SIZE_GB }}
          HETZNER_ENABLE_BACKUPS: ${{ vars.HETZNER_ENABLE_BACKUPS }}
          SSH_ALLOWED_CIDRS: ${{ vars.SSH_ALLOWED_CIDRS }}
          DEPLOY_SSH_PUBLIC_KEY: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
          PULUMI_SKIP_UPDATE_CHECK: "true"
        with:
          command: up
          stack-name: ${{ vars.PULUMI_STACK }}
          work-dir: infrastructure/identity
          cloud-url: "s3://${{ vars.PULUMI_STATE_S3_BUCKET }}/avenos/identity?endpoint=${{ vars.PULUMI_STATE_S3_REGION }}.your-objectstorage.com&region=${{ vars.PULUMI_STATE_S3_REGION }}&s3ForcePathStyle=true&awssdk=v2"
          secrets-provider: passphrase
          upsert: true
          refresh: true
          diff: true
          comment-on-summary: true

  deploy-identity-next:
    name: deploy identity stack
    needs:
      [
        publish-identity-image,
        publish-artifact-store-image,
        publish-intent-service-image,
        publish-static-site-host-image,
        deploy-identity-infrastructure-next,
      ]
    runs-on: ubuntu-latest
    environment: next
    concurrency:
      group: identity-next
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish-identity-image.outputs.commit }}

      - name: Materialize deployment files
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          IDENTITY_DOMAIN: ${{ vars.IDENTITY_DOMAIN }}
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          NAME_PRICE_EUR: ${{ vars.NAME_PRICE_EUR }}
          DOCKER_LOG_MAX_SIZE: ${{ vars.DOCKER_LOG_MAX_SIZE }}
          DOCKER_LOG_MAX_FILE: ${{ vars.DOCKER_LOG_MAX_FILE }}
          DOCKER_LOG_COMPRESS: ${{ vars.DOCKER_LOG_COMPRESS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EMAIL_QUEUE_ENCRYPTION_KEY: ${{ secrets.EMAIL_QUEUE_ENCRYPTION_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AVEN_MIGRATOR_PASSWORD: ${{ secrets.AVEN_MIGRATOR_PASSWORD }}
          AVEN_SERVER_PASSWORD: ${{ secrets.AVEN_SERVER_PASSWORD }}
          AVEN_EMAIL_WORKER_PASSWORD: ${{ secrets.AVEN_EMAIL_WORKER_PASSWORD }}
          AVEN_ENVIRONMENT_WORKER_PASSWORD: ${{ secrets.AVEN_ENVIRONMENT_WORKER_PASSWORD }}
          AVEN_PROVISIONER_PASSWORD: ${{ secrets.AVEN_PROVISIONER_PASSWORD }}
          ARTIFACT_STORE_BEARER_TOKEN: ${{ secrets.ARTIFACT_STORE_BEARER_TOKEN }}
          ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN: ${{ secrets.ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN }}
          ARTIFACT_STORE_RUNTIME_PASSWORD: ${{ secrets.ARTIFACT_STORE_RUNTIME_PASSWORD }}
          ARTIFACT_PROCESSOR_BEARER_TOKEN: ${{ secrets.ARTIFACT_PROCESSOR_BEARER_TOKEN }}
          ARTIFACT_PROCESSOR_DIRECTORY_BEARER_TOKEN: ${{ secrets.ARTIFACT_PROCESSOR_DIRECTORY_BEARER_TOKEN }}
          ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN: ${{ secrets.ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN }}
          ARTIFACT_PROCESSOR_RUNTIME_PASSWORD: ${{ secrets.ARTIFACT_PROCESSOR_RUNTIME_PASSWORD }}
          ARTIFACT_PROCESSOR_VISION_API_KEY: ${{ secrets.ARTIFACT_PROCESSOR_VISION_API_KEY }}
          INTENT_SERVICE_BEARER_TOKEN: ${{ secrets.INTENT_SERVICE_BEARER_TOKEN }}
          INTENT_SERVICE_DIRECTORY_BEARER_TOKEN: ${{ secrets.INTENT_SERVICE_DIRECTORY_BEARER_TOKEN }}
          INTENT_SERVICE_PROVISIONER_BEARER_TOKEN: ${{ secrets.INTENT_SERVICE_PROVISIONER_BEARER_TOKEN }}
          INTENT_SERVICE_RUNTIME_PASSWORD: ${{ secrets.INTENT_SERVICE_RUNTIME_PASSWORD }}
          INTENT_SERVICE_PROCESSOR_BEARER_TOKEN: ${{ secrets.INTENT_SERVICE_PROCESSOR_BEARER_TOKEN }}
          SITE_HOST_DIRECTORY_BEARER_TOKEN: ${{ secrets.SITE_HOST_DIRECTORY_BEARER_TOKEN }}
          SITE_HOST_ALLOWED_IPV4: ${{ needs.deploy-identity-infrastructure-next.outputs.deploy-host }}
          SITE_HOST_ALLOWED_IPV6: ${{ vars.SITE_HOST_ALLOWED_IPV6 }}
          SITE_HOST_POLL_SECONDS: ${{ vars.SITE_HOST_POLL_SECONDS }}
          SITE_HOST_DNS_GRACE_SECONDS: ${{ vars.SITE_HOST_DNS_GRACE_SECONDS }}
          SITE_HOST_MAX_FILES: ${{ vars.SITE_HOST_MAX_FILES }}
          SITE_HOST_MAX_BYTES: ${{ vars.SITE_HOST_MAX_BYTES }}
          SITE_HOST_MAX_CONCURRENT_SYNCS: ${{ vars.SITE_HOST_MAX_CONCURRENT_SYNCS }}
          ARTIFACT_STORE_MAX_TENANT_POOLS: ${{ vars.ARTIFACT_STORE_MAX_TENANT_POOLS }}
          ARTIFACT_STORE_CONNECTIONS_PER_TENANT: ${{ vars.ARTIFACT_STORE_CONNECTIONS_PER_TENANT }}
          ARTIFACT_STORE_MEMORY_LIMIT: ${{ vars.ARTIFACT_STORE_MEMORY_LIMIT }}
          ARTIFACT_STORE_MAX_UPLOAD_BYTES: ${{ vars.ARTIFACT_STORE_MAX_UPLOAD_BYTES }}
          ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS: ${{ vars.ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS }}
          ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE: ${{ vars.ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE }}
          ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE: ${{ vars.ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE }}
          ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE: ${{ vars.ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE }}
          ARTIFACT_PROCESSOR_MAX_TENANT_POOLS: ${{ vars.ARTIFACT_PROCESSOR_MAX_TENANT_POOLS }}
          ARTIFACT_PROCESSOR_CONNECTIONS_PER_TENANT: ${{ vars.ARTIFACT_PROCESSOR_CONNECTIONS_PER_TENANT }}
          ARTIFACT_PROCESSOR_TENANT_REFRESH_SECONDS: ${{ vars.ARTIFACT_PROCESSOR_TENANT_REFRESH_SECONDS }}
          ARTIFACT_PROCESSOR_MEMORY_LIMIT: ${{ vars.ARTIFACT_PROCESSOR_MEMORY_LIMIT }}
          ARTIFACT_PROCESSOR_VISION_ENABLED: ${{ vars.ARTIFACT_PROCESSOR_VISION_ENABLED }}
          ARTIFACT_PROCESSOR_VISION_BASE_URL: ${{ vars.ARTIFACT_PROCESSOR_VISION_BASE_URL }}
          ARTIFACT_PROCESSOR_VISION_MODEL: ${{ vars.ARTIFACT_PROCESSOR_VISION_MODEL }}
          ARTIFACT_PROCESSOR_VISION_PROFILE: ${{ vars.ARTIFACT_PROCESSOR_VISION_PROFILE }}
          ARTIFACT_PROCESSOR_VISION_AUTH_MODE: ${{ vars.ARTIFACT_PROCESSOR_VISION_AUTH_MODE }}
          ARTIFACT_PROCESSOR_VISION_MAX_PAGES: ${{ vars.ARTIFACT_PROCESSOR_VISION_MAX_PAGES }}
          ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS: ${{ vars.ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS }}
          INTENT_SERVICE_MAX_TENANT_POOLS: ${{ vars.INTENT_SERVICE_MAX_TENANT_POOLS }}
          INTENT_SERVICE_CONNECTIONS_PER_TENANT: ${{ vars.INTENT_SERVICE_CONNECTIONS_PER_TENANT }}
          INTENT_SERVICE_TENANT_REFRESH_SECONDS: ${{ vars.INTENT_SERVICE_TENANT_REFRESH_SECONDS }}
          INTENT_SERVICE_MEMORY_LIMIT: ${{ vars.INTENT_SERVICE_MEMORY_LIMIT }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          POLAR_API_KEY: ${{ secrets.POLAR_API_KEY }}
          POLAR_SERVER: ${{ vars.POLAR_SERVER || 'sandbox' }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          IMAGE: ${{ needs.publish-identity-image.outputs.image }}@${{ needs.publish-identity-image.outputs.digest }}
          ARTIFACT_IMAGE: ${{ needs.publish-artifact-store-image.outputs.image }}@${{ needs.publish-artifact-store-image.outputs.digest }}
          INTENT_IMAGE: ${{ needs.publish-intent-service-image.outputs.image }}@${{ needs.publish-intent-service-image.outputs.digest }}
          SITE_HOST_IMAGE: ${{ needs.publish-static-site-host-image.outputs.image }}@${{ needs.publish-static-site-host-image.outputs.digest }}
          VERSION: ${{ needs.publish-identity-image.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "$PUBLIC_BASE_URL" != "https://$IDENTITY_DOMAIN" ] || [ "$WEBAUTHN_RP_ID" != "$IDENTITY_DOMAIN" ]; then
            echo "::error::PUBLIC_BASE_URL, IDENTITY_DOMAIN, and WEBAUTHN_RP_ID do not match."
            exit 1
          fi
          for secret in "$ARTIFACT_STORE_BEARER_TOKEN" "$ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN" "$ARTIFACT_STORE_RUNTIME_PASSWORD"; do
            if [[ ! "$secret" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
              echo "::error::Artifact Store credentials must be 32-128 URL-safe characters."
              exit 1
            fi
          done
          if [ "$ARTIFACT_STORE_BEARER_TOKEN" = "$ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN" ]; then
            echo "::error::Artifact Store runtime and provisioner bearer credentials must differ."
            exit 1
          fi
          if [[ ! "$SITE_HOST_DIRECTORY_BEARER_TOKEN" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
            echo "::error::Static site host credential must be 32-128 URL-safe characters."
            exit 1
          fi
          if [[ ! "$SITE_HOST_ALLOWED_IPV4" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Static site host needs the deployed host IPv4 address."
            exit 1
          fi
          processor_credentials=(
            "$ARTIFACT_PROCESSOR_BEARER_TOKEN"
            "$ARTIFACT_PROCESSOR_DIRECTORY_BEARER_TOKEN"
            "$ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN"
            "$ARTIFACT_PROCESSOR_RUNTIME_PASSWORD"
          )
          intent_credentials=(
            "$INTENT_SERVICE_BEARER_TOKEN"
            "$INTENT_SERVICE_DIRECTORY_BEARER_TOKEN"
            "$INTENT_SERVICE_PROVISIONER_BEARER_TOKEN"
            "$INTENT_SERVICE_RUNTIME_PASSWORD"
            "$INTENT_SERVICE_PROCESSOR_BEARER_TOKEN"
          )
          for secret in "${intent_credentials[@]}"; do
            if [[ ! "$secret" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
              echo "::error::Intent Service credentials must be 32-128 URL-safe characters."
              exit 1
            fi
          done
          for secret in "${processor_credentials[@]}"; do
            if [[ ! "$secret" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
              echo "::error::Artifact Processor credentials must be 32-128 URL-safe characters."
              exit 1
            fi
          done
          distinct_credentials=(
            "$SITE_HOST_DIRECTORY_BEARER_TOKEN"
            "$ARTIFACT_STORE_BEARER_TOKEN"
            "$ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN"
            "$ARTIFACT_STORE_RUNTIME_PASSWORD"
            "${processor_credentials[@]}"
            "${intent_credentials[@]}"
          )
          if [ "$(printf '%s\n' "${distinct_credentials[@]}" | sort -u | wc -l)" -ne "${#distinct_credentials[@]}" ]; then
            echo "::error::Customer-data service credentials must all differ."
            exit 1
          fi
          DOCKER_LOG_MAX_SIZE=${DOCKER_LOG_MAX_SIZE:-10m}
          DOCKER_LOG_MAX_FILE=${DOCKER_LOG_MAX_FILE:-5}
          DOCKER_LOG_COMPRESS=${DOCKER_LOG_COMPRESS:-true}
          ARTIFACT_STORE_MEMORY_LIMIT=${ARTIFACT_STORE_MEMORY_LIMIT:-512m}
          ARTIFACT_STORE_MAX_UPLOAD_BYTES=${ARTIFACT_STORE_MAX_UPLOAD_BYTES:-26214400}
          ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS=${ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS:-2}
          ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE=${ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE:-32}
          ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE=${ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE:-104857600}
          ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE=${ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE:-1073741824}
          ARTIFACT_PROCESSOR_MAX_TENANT_POOLS=${ARTIFACT_PROCESSOR_MAX_TENANT_POOLS:-64}
          ARTIFACT_PROCESSOR_CONNECTIONS_PER_TENANT=${ARTIFACT_PROCESSOR_CONNECTIONS_PER_TENANT:-2}
          ARTIFACT_PROCESSOR_TENANT_REFRESH_SECONDS=${ARTIFACT_PROCESSOR_TENANT_REFRESH_SECONDS:-30}
          ARTIFACT_PROCESSOR_MEMORY_LIMIT=${ARTIFACT_PROCESSOR_MEMORY_LIMIT:-768m}
          ARTIFACT_PROCESSOR_VISION_MAX_PAGES=${ARTIFACT_PROCESSOR_VISION_MAX_PAGES:-15}
          ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS=${ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS:-180}
          INTENT_SERVICE_MAX_TENANT_POOLS=${INTENT_SERVICE_MAX_TENANT_POOLS:-64}
          INTENT_SERVICE_CONNECTIONS_PER_TENANT=${INTENT_SERVICE_CONNECTIONS_PER_TENANT:-2}
          INTENT_SERVICE_TENANT_REFRESH_SECONDS=${INTENT_SERVICE_TENANT_REFRESH_SECONDS:-30}
          INTENT_SERVICE_MEMORY_LIMIT=${INTENT_SERVICE_MEMORY_LIMIT:-512m}
          if [ "$ARTIFACT_PROCESSOR_VISION_ENABLED" != true ]; then
            echo "::error::ARTIFACT_PROCESSOR_VISION_ENABLED must be true for the next finance-processing rollout."
            exit 1
          fi
          node <<'NODE'
          const raw = process.env.ARTIFACT_PROCESSOR_VISION_BASE_URL ?? ''
          let url
          try {
            url = new URL(raw)
          } catch {
            console.error('::error::ARTIFACT_PROCESSOR_VISION_BASE_URL must be an absolute HTTPS URL.')
            process.exit(1)
          }
          if (
            raw.trim() !== raw ||
            /[\r\n]/.test(raw) ||
            url.protocol !== 'https:' ||
            !url.hostname ||
            url.username ||
            url.password ||
            url.search ||
            url.hash
          ) {
            console.error('::error::ARTIFACT_PROCESSOR_VISION_BASE_URL must be HTTPS without credentials, query, fragment, or surrounding whitespace.')
            process.exit(1)
          }
          NODE
          if [[ ! "$ARTIFACT_PROCESSOR_VISION_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._/:@-]{0,254}$ ]]; then
            echo "::error::ARTIFACT_PROCESSOR_VISION_MODEL must be a 1-255 character deployment identifier without whitespace."
            exit 1
          fi
          case "$ARTIFACT_PROCESSOR_VISION_PROFILE" in
            openai-tools|openai-json-schema|qwen-tools|generic-json) ;;
            *)
              echo "::error::ARTIFACT_PROCESSOR_VISION_PROFILE is unsupported."
              exit 1
              ;;
          esac
          case "$ARTIFACT_PROCESSOR_VISION_AUTH_MODE" in
            bearer)
              if [ "${#ARTIFACT_PROCESSOR_VISION_API_KEY}" -lt 20 ] || [ "${#ARTIFACT_PROCESSOR_VISION_API_KEY}" -gt 512 ] || [[ "$ARTIFACT_PROCESSOR_VISION_API_KEY" =~ [[:space:]] ]]; then
                echo "::error::Bearer vision auth requires an API key of 20-512 non-whitespace characters."
                exit 1
              fi
              ;;
            none)
              if [ -n "$ARTIFACT_PROCESSOR_VISION_API_KEY" ]; then
                echo "::error::Do not configure a vision API key when auth mode is none."
                exit 1
              fi
              ;;
            *)
              echo "::error::ARTIFACT_PROCESSOR_VISION_AUTH_MODE must be bearer or none."
              exit 1
              ;;
          esac
          if [[ ! "$DOCKER_LOG_MAX_SIZE" =~ ^[1-9][0-9]*[kmg]$ ]]; then
            echo "::error::DOCKER_LOG_MAX_SIZE must be a positive size such as 10m."
            exit 1
          fi
          if [[ ! "$DOCKER_LOG_MAX_FILE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::DOCKER_LOG_MAX_FILE must be a positive integer."
            exit 1
          fi
          if [[ "$DOCKER_LOG_COMPRESS" != true && "$DOCKER_LOG_COMPRESS" != false ]]; then
            echo "::error::DOCKER_LOG_COMPRESS must be true or false."
            exit 1
          fi
          if [[ ! "$ARTIFACT_STORE_MEMORY_LIMIT" =~ ^[1-9][0-9]*[mg]$ ]]; then
            echo "::error::ARTIFACT_STORE_MEMORY_LIMIT must be a positive size such as 512m."
            exit 1
          fi
          if [[ ! "$ARTIFACT_PROCESSOR_MEMORY_LIMIT" =~ ^[1-9][0-9]*[mg]$ ]]; then
            echo "::error::ARTIFACT_PROCESSOR_MEMORY_LIMIT must be a positive size such as 768m."
            exit 1
          fi
          if [[ ! "$INTENT_SERVICE_MEMORY_LIMIT" =~ ^[1-9][0-9]*[mg]$ ]]; then
            echo "::error::INTENT_SERVICE_MEMORY_LIMIT must be a positive size such as 512m."
            exit 1
          fi
          for value in "$INTENT_SERVICE_MAX_TENANT_POOLS" "$INTENT_SERVICE_CONNECTIONS_PER_TENANT" "$INTENT_SERVICE_TENANT_REFRESH_SECONDS"; do
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Intent Service limits must be positive integers."
              exit 1
            fi
          done
          for value in "$ARTIFACT_PROCESSOR_MAX_TENANT_POOLS" "$ARTIFACT_PROCESSOR_CONNECTIONS_PER_TENANT" "$ARTIFACT_PROCESSOR_TENANT_REFRESH_SECONDS"; do
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Artifact Processor limits must be positive integers."
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_PROCESSOR_VISION_MAX_PAGES" =~ ^([1-9]|[1-5][0-9]|6[0-3])$ ]]; then
            echo "::error::ARTIFACT_PROCESSOR_VISION_MAX_PAGES must be from 1 through 63."
            exit 1
          fi
          if [[ ! "$ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || [ "$ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS" -lt 5 ] || [ "$ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS" -gt 900 ]; then
            echo "::error::ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS must be from 5 through 900."
            exit 1
          fi
          for value in "$ARTIFACT_STORE_MAX_UPLOAD_BYTES" "$ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS" "$ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE" "$ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE" "$ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE"; do
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Artifact Store admission limits must be positive integers."
