name: aven-api-operations

on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment
        type: choice
        options: [next, production]
        required: true
      operation:
        description: Operation
        type: choice
        options: [status, retry, reconcile, edge-status]
        required: true
      name:
        description: Customer name; required for status and retry
        type: string
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Validate input
        env:
          OPERATION: ${{ inputs.operation }}
          CUSTOMER_NAME: ${{ inputs.name }}
        run: |
          if [[ "$OPERATION" != "reconcile" && "$OPERATION" != "edge-status" && ! "$CUSTOMER_NAME" =~ ^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$ ]]; then
            echo "::error::A valid customer name is required."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Run fixed operation
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          OPERATION: ${{ inputs.operation }}
          CUSTOMER_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_args=(-i "$RUNNER_TEMP/ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes)
          case "$OPERATION" in
            status|retry)
              # Values are validated above and intentionally expanded by this runner.
              # shellcheck disable=SC2029
              ssh "${ssh_args[@]}" "$remote" "cd /opt/aven-api && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml exec -T app bun build/scripts/environment.js '$OPERATION' '$CUSTOMER_NAME'"
              ;;
            reconcile)
              ssh "${ssh_args[@]}" "$remote" "cd /opt/aven-api && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.deploy.yml exec -T app bun build/scripts/environment.js reconcile"
              ;;
            edge-status)
              ssh "${ssh_args[@]}" "$remote" \
                "sudo docker inspect aven-hosting-caddy-1 --format 'image={{.Config.Image}} created={{.Created}} labels={{json .Config.Labels}} mounts={{json .Mounts}} networks={{json .NetworkSettings.Networks}}' && sudo docker ps --all --filter name=aven-hosting --format 'table {{.Names}}\\t{{.Image}}\\t{{.Status}}\\t{{.Ports}}' && sudo docker exec aven-hosting-caddy-1 caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty"
              ;;
          esac
