# Strip heavy debuginfo from third-party deps in dev builds. The dev default is
# full debuginfo (`debug = 2`) embedded into every dep's artifacts in deps/, which
# — multiplied across the Tauri dep tree and each target triple — was the bulk of a
# 57 GB target/rust/. `line-tables-only` keeps file:line in panic backtraces but
# drops variable/type debug data. Our own workspace crates keep full debug.
[profile.dev.package."*"]
debug = "line-tables-only"

# Release/store builds don't benefit from incremental (no iterative recompiles),
# but the repo-wide `[build] incremental = true` (.cargo/config.toml, for fast dev)
# would otherwise leak into them — that produced ~7.5 GB of dead incremental data
# under the iOS/macOS release target triples. Turn it off for release explicitly.
[profile.release]
incremental = false

[package]
name = "aven-os-app"
version = "26.7.31-next.3"
description = "avenCITY desktop shell"
authors = ["Aven"]
edition = "2021"
rust-version = "1.93"

[lib]
name = "aven_os_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aven-os-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The shell hosts avenCITY, which is entirely webview-side (three.js). Nothing
# here needs crypto, storage, sync or on-device AI, so the feature matrix that
# used to gate them went with the worlds that used it (card 0121).
[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
env_logger = "0.11.10"

# On-device German TTS — Supertonic-3 through ONNX Runtime (src/tts).
# Versions match the upstream reference implementation the inference code is
# vendored from, so it can be diffed against theirs when they publish a new
# model revision.
anyhow = "1"
ort = "2.0.0-rc.7"
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
hound = "3.5"
rustfft = "6.2"
unicode-normalization = "0.1"
regex = "1.10"
# Fetches the ~400 MB of weights on first run. Blocking and tiny; the commands
# that call it are already async and off the UI thread.
ureq = "2"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = { version = "0.2", features = ["logger"] }
