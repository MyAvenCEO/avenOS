# Local overlay for the per-customer Artifact Store topology. The bootstrap database
# is only a smoke-test customer; real customer databases are created by the existing
# environment worker and provisioned through artifact-store-provisioner.
x-artifact-local-logging: &artifact-local-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "${DOCKER_LOG_COMPRESS:-true}"

x-artifact-runtime-security: &artifact-runtime-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *artifact-local-logging

x-artifact-image: &artifact-image
  image: aven-artifact-store:local
  build:
    context: ../..
    dockerfile: services/artifact-store/Dockerfile

services:
  artifact-local-bootstrap:
    image: postgres:17-alpine
    logging: *artifact-local-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-aven-dev}
      ARTIFACT_STORE_RUNTIME_PASSWORD: ${ARTIFACT_STORE_RUNTIME_PASSWORD:-artifact-local-runtime-password-0001}
      ARTIFACT_PROCESSOR_RUNTIME_PASSWORD: ${ARTIFACT_PROCESSOR_RUNTIME_PASSWORD:-processor-local-runtime-password-0001}
    volumes:
      - ./deploy/artifact-local-bootstrap.sh:/usr/local/bin/artifact-local-bootstrap:ro
    command: ["sh", "/usr/local/bin/artifact-local-bootstrap"]
    restart: "no"

  artifact-store-provisioner:
    <<: [*artifact-runtime-security, *artifact-image]
    depends_on:
      artifact-local-bootstrap:
        condition: service_completed_successfully
    environment:
      ARTIFACT_STORE_PROVISIONER_DATABASE_URL: postgres://aven_provisioner:${AVEN_PROVISIONER_PASSWORD:-provisioner-dev}@db:5432/postgres
      ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN: ${ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN:-artifact-local-provisioner-token-0001}
      ARTIFACT_STORE_RUNTIME_ROLE: aven_artifact_store
      ARTIFACT_STORE_PROVISIONER_LISTEN: 0.0.0.0:8088
      ARTIFACT_STORE_HEALTH_PORT: 8088
      RUST_LOG: ${ARTIFACT_STORE_LOG:-aven_artifact_store=info,tower_http=info}
    command: ["serve-provisioner"]

  artifact-store-migrator:
    <<: [*artifact-runtime-security, *artifact-image]
    depends_on:
      artifact-local-bootstrap:
        condition: service_completed_successfully
    environment:
      ARTIFACT_STORE_DATABASE_URL: postgres://aven_provisioner:${AVEN_PROVISIONER_PASSWORD:-provisioner-dev}@db:5432/cust_artifact_local
      ARTIFACT_STORE_SCOPE_ID: ${ARTIFACT_STORE_SCOPE_ID:-11111111-1111-4111-8111-111111111111}
      ARTIFACT_STORE_RUNTIME_ROLE: aven_artifact_store
    command: ["migrate"]
    restart: "no"

  artifact-store:
    <<: [*artifact-runtime-security, *artifact-image]
    mem_limit: ${ARTIFACT_STORE_MEMORY_LIMIT:-512m}
    pids_limit: 128
    depends_on:
      artifact-store-migrator:
        condition: service_completed_successfully
    environment:
      ARTIFACT_STORE_DATABASE_URL: postgres://aven_artifact_store:${ARTIFACT_STORE_RUNTIME_PASSWORD:-artifact-local-runtime-password-0001}@db:5432/postgres
      ARTIFACT_STORE_TENANT_MODE: "true"
      ARTIFACT_STORE_MAX_TENANT_POOLS: ${ARTIFACT_STORE_MAX_TENANT_POOLS:-64}
      ARTIFACT_STORE_CONNECTIONS_PER_TENANT: ${ARTIFACT_STORE_CONNECTIONS_PER_TENANT:-2}
      ARTIFACT_STORE_MAX_UPLOAD_BYTES: ${ARTIFACT_STORE_MAX_UPLOAD_BYTES:-26214400}
      ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS: ${ARTIFACT_STORE_MAX_CONCURRENT_UPLOADS:-2}
      ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE: ${ARTIFACT_STORE_MAX_LIVE_CLAIMS_PER_SCOPE:-32}
      ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE: ${ARTIFACT_STORE_MAX_STAGED_BYTES_PER_SCOPE:-104857600}
      ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE: ${ARTIFACT_STORE_MAX_LOGICAL_BYTES_PER_SCOPE:-1073741824}
      ARTIFACT_STORE_BEARER_TOKEN: ${ARTIFACT_STORE_BEARER_TOKEN:-artifact-local-coordinator-token-0001}
      ARTIFACT_STORE_PUBLISHER_ISSUER: ${ARTIFACT_STORE_PUBLISHER_ISSUER:-aven-api}
      ARTIFACT_STORE_PUBLISHER_SUBJECT: ${ARTIFACT_STORE_PUBLISHER_SUBJECT:-artifact-coordinator}
      ARTIFACT_STORE_LISTEN: 0.0.0.0:8087
      RUST_LOG: ${ARTIFACT_STORE_LOG:-aven_artifact_store=info,tower_http=info}
    ports:
      - "${ARTIFACT_STORE_BIND:-127.0.0.1}:${ARTIFACT_STORE_PORT:-8087}:8087"

  artifact-processor-migrator:
    <<: [*artifact-runtime-security, *artifact-image]
    depends_on:
      artifact-store-migrator:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/aven-artifact-processor"]
    environment:
      ARTIFACT_PROCESSOR_DATABASE_URL: postgres://aven_provisioner:${AVEN_PROVISIONER_PASSWORD:-provisioner-dev}@db:5432/cust_artifact_local
      ARTIFACT_PROCESSOR_RUNTIME_ROLE: aven_artifact_processor
      ARTIFACT_PROCESSOR_SCOPE_ID: ${ARTIFACT_STORE_SCOPE_ID:-11111111-1111-4111-8111-111111111111}
    command: ["migrate"]
    restart: "no"

  artifact-processor-provisioner:
    <<: [*artifact-runtime-security, *artifact-image]
    depends_on:
      artifact-local-bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/aven-artifact-processor"]
    environment:
      ARTIFACT_PROCESSOR_PROVISIONER_DATABASE_URL: postgres://aven_provisioner:${AVEN_PROVISIONER_PASSWORD:-provisioner-dev}@db:5432/postgres
      ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN: ${ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN:-processor-local-provisioner-token-0001}
      ARTIFACT_PROCESSOR_RUNTIME_ROLE: aven_artifact_processor
      ARTIFACT_PROCESSOR_PROVISIONER_LISTEN: 0.0.0.0:8090
      ARTIFACT_STORE_HEALTH_PORT: 8090
      RUST_LOG: ${ARTIFACT_PROCESSOR_LOG:-aven_artifact_processor=info,tower_http=info}
    command: ["serve-provisioner"]

  artifact-processor:
    <<: [*artifact-runtime-security, *artifact-image]
    mem_limit: ${ARTIFACT_PROCESSOR_MEMORY_LIMIT:-512m}
    pids_limit: 128
    depends_on:
      artifact-store:
        condition: service_healthy
      artifact-processor-migrator:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/aven-artifact-processor"]
    environment:
      ARTIFACT_PROCESSOR_DATABASE_URL: postgres://aven_artifact_processor:${ARTIFACT_PROCESSOR_RUNTIME_PASSWORD:-processor-local-runtime-password-0001}@db:5432/cust_artifact_local
      ARTIFACT_PROCESSOR_SCOPE_ID: ${ARTIFACT_STORE_SCOPE_ID:-11111111-1111-4111-8111-111111111111}
      ARTIFACT_PROCESSOR_BEARER_TOKEN: ${ARTIFACT_PROCESSOR_BEARER_TOKEN:-processor-local-status-token-0001}
      ARTIFACT_PROCESSOR_VISION_ENABLED: ${ARTIFACT_PROCESSOR_VISION_ENABLED:-false}
      ARTIFACT_PROCESSOR_VISION_BASE_URL: ${ARTIFACT_PROCESSOR_VISION_BASE_URL:-http://host.docker.internal:8000/v1}
      ARTIFACT_PROCESSOR_VISION_MODEL: ${ARTIFACT_PROCESSOR_VISION_MODEL:-local-vision-model}
      ARTIFACT_PROCESSOR_VISION_PROFILE: ${ARTIFACT_PROCESSOR_VISION_PROFILE:-generic-json}
      ARTIFACT_PROCESSOR_VISION_AUTH_MODE: ${ARTIFACT_PROCESSOR_VISION_AUTH_MODE:-none}
      ARTIFACT_PROCESSOR_VISION_API_KEY: ${ARTIFACT_PROCESSOR_VISION_API_KEY:-}
      ARTIFACT_PROCESSOR_VISION_MAX_PAGES: ${ARTIFACT_PROCESSOR_VISION_MAX_PAGES:-15}
      ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS: ${ARTIFACT_PROCESSOR_VISION_TIMEOUT_SECONDS:-180}
      ARTIFACT_PROCESSOR_VISION_ALLOW_INSECURE_HTTP: ${ARTIFACT_PROCESSOR_VISION_ALLOW_INSECURE_HTTP:-true}
      ARTIFACT_PROCESSOR_LISTEN: 0.0.0.0:8089
      ARTIFACT_STORE_BASE_URL: http://artifact-store:8087
      ARTIFACT_STORE_BEARER_TOKEN: ${ARTIFACT_STORE_BEARER_TOKEN:-artifact-local-coordinator-token-0001}
      ARTIFACT_STORE_DATABASE_NAME: cust_artifact_local
      RUST_LOG: ${ARTIFACT_PROCESSOR_LOG:-aven_artifact_processor=info,tower_http=info}
      ARTIFACT_STORE_HEALTH_PORT: 8089
    command: ["serve"]
    ports:
      - "${ARTIFACT_PROCESSOR_BIND:-127.0.0.1}:${ARTIFACT_PROCESSOR_PORT:-8089}:8089"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    depends_on:
      artifact-store:
        condition: service_healthy
      artifact-processor:
        condition: service_healthy
    environment:
      ARTIFACT_STORE_BASE_URL: http://artifact-store:8087
      ARTIFACT_STORE_BEARER_TOKEN: ${ARTIFACT_STORE_BEARER_TOKEN:-artifact-local-coordinator-token-0001}
      ARTIFACT_PROCESSOR_BASE_URL: http://artifact-processor:8089
      ARTIFACT_PROCESSOR_BEARER_TOKEN: ${ARTIFACT_PROCESSOR_BEARER_TOKEN:-processor-local-status-token-0001}
      ARTIFACT_PROCESSOR_DIRECTORY_BEARER_TOKEN: ${ARTIFACT_PROCESSOR_DIRECTORY_BEARER_TOKEN:-processor-local-directory-token-0001}

  environment-worker:
    depends_on:
      artifact-store-provisioner:
        condition: service_healthy
      artifact-processor-provisioner:
        condition: service_healthy
    environment:
      ARTIFACT_STORE_PROVISIONER_BASE_URL: http://artifact-store-provisioner:8088
      ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN: ${ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN:-artifact-local-provisioner-token-0001}
      ARTIFACT_STORE_RUNTIME_ROLE: aven_artifact_store
      ARTIFACT_STORE_RUNTIME_PASSWORD: ${ARTIFACT_STORE_RUNTIME_PASSWORD:-artifact-local-runtime-password-0001}
      ARTIFACT_PROCESSOR_PROVISIONER_BASE_URL: http://artifact-processor-provisioner:8090
      ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN: ${ARTIFACT_PROCESSOR_PROVISIONER_BEARER_TOKEN:-processor-local-provisioner-token-0001}
      ARTIFACT_PROCESSOR_RUNTIME_ROLE: aven_artifact_processor
      ARTIFACT_PROCESSOR_RUNTIME_PASSWORD: ${ARTIFACT_PROCESSOR_RUNTIME_PASSWORD:-processor-local-runtime-password-0001}
