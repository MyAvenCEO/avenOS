x-local-logging: &local-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "${DOCKER_LOG_COMPRESS:-true}"

services:
  db:
    volumes:
      - /var/lib/aven/postgres:/var/lib/postgresql/data
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
  migrator:
    image: ${AVEN_API_IMAGE}
  app:
    image: ${AVEN_API_IMAGE}
    restart: unless-stopped
    environment:
      SITE_HOST_DIRECTORY_BEARER_TOKEN: ${SITE_HOST_DIRECTORY_BEARER_TOKEN}
      SITE_HOST_PUBLIC_IPV4: ${SITE_HOST_ALLOWED_IPV4}
      SITE_HOST_PUBLIC_IPV6: ${SITE_HOST_ALLOWED_IPV6:-}
  email-worker:
    image: ${AVEN_API_IMAGE}
    restart: unless-stopped
  environment-worker:
    image: ${AVEN_API_IMAGE}
    restart: unless-stopped
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${IDENTITY_DOMAIN}
      ARTIFACT_STORE_MAX_UPLOAD_BYTES: ${ARTIFACT_STORE_MAX_UPLOAD_BYTES:-26214400}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/aven/caddy/data:/data
      - /var/lib/aven/caddy/config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *local-logging
  static-site-host:
    image: ${AVEN_STATIC_SITE_HOST_IMAGE}
    restart: unless-stopped
    environment:
      SITE_HOST_LISTEN: 0.0.0.0:8093
      SITE_HOST_DATA_ROOT: /var/lib/aven/static-sites
      SITE_HOST_DIRECTORY_URL: http://app:3000/internal/v1/static-sites/bindings
      SITE_HOST_STATUS_URL: http://app:3000/internal/v1/static-sites/status
      SITE_HOST_DIRECTORY_BEARER_TOKEN: ${SITE_HOST_DIRECTORY_BEARER_TOKEN}
      SITE_HOST_ALLOWED_IPV4: ${SITE_HOST_ALLOWED_IPV4}
      SITE_HOST_ALLOWED_IPV6: ${SITE_HOST_ALLOWED_IPV6:-}
      SITE_HOST_POLL_SECONDS: ${SITE_HOST_POLL_SECONDS:-60}
      SITE_HOST_DNS_GRACE_SECONDS: ${SITE_HOST_DNS_GRACE_SECONDS:-86400}
      SITE_HOST_MAX_FILES: ${SITE_HOST_MAX_FILES:-10000}
      SITE_HOST_MAX_BYTES: ${SITE_HOST_MAX_BYTES:-268435456}
    volumes:
      - /var/lib/aven/static-sites:/var/lib/aven/static-sites
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *local-logging
