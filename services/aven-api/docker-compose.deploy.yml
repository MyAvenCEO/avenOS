x-local-logging: &local-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "${DOCKER_LOG_COMPRESS:-true}"

services:
  db:
    volumes:
      - /var/lib/aven/postgres:/var/lib/postgresql/data
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
  migrator:
    image: ${AVEN_API_IMAGE}
  app:
    image: ${AVEN_API_IMAGE}
    restart: unless-stopped
  email-worker:
    image: ${AVEN_API_IMAGE}
    restart: unless-stopped
  environment-worker:
    image: ${AVEN_API_IMAGE}
    restart: unless-stopped
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${IDENTITY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/aven/caddy/data:/data
      - /var/lib/aven/caddy/config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *local-logging
