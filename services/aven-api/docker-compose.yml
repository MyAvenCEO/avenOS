x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
  ANDROID_APP_CERT_SHA256_FINGERPRINTS: ${ANDROID_APP_CERT_SHA256_FINGERPRINTS:-}
  ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:3000}
  POW_DIFFICULTY_BITS: ${POW_DIFFICULTY_BITS:-16}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DOWNLOAD_URL: ${DOWNLOAD_URL:-http://localhost:3000/download}
  REQUIRE_PASSKEY_PRF: ${REQUIRE_PASSKEY_PRF:-false}
  NAME_PRICE_EUR: ${NAME_PRICE_EUR:-25}
  NAME_HOLD_TTL_HOURS: ${NAME_HOLD_TTL_HOURS:-24}
  NAME_RESERVATION_TTL_MINUTES: ${NAME_RESERVATION_TTL_MINUTES:-5}

x-local-logging: &local-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "${DOCKER_LOG_COMPRESS:-true}"

x-runtime-security: &runtime-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *local-logging

x-aven-image: &aven-image
  image: aven-api:local
  build:
    context: ../..
    dockerfile: services/aven-api/Dockerfile

services:
  db:
    image: postgres:17-alpine
    logging: *local-logging
    environment:
      POSTGRES_DB: aven
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aven-dev}
      AVEN_MIGRATOR_PASSWORD: ${AVEN_MIGRATOR_PASSWORD:-migrator-dev}
      AVEN_SERVER_PASSWORD: ${AVEN_SERVER_PASSWORD:-server-dev}
      AVEN_EMAIL_WORKER_PASSWORD: ${AVEN_EMAIL_WORKER_PASSWORD:-email-dev}
      AVEN_ENVIRONMENT_WORKER_PASSWORD: ${AVEN_ENVIRONMENT_WORKER_PASSWORD:-environment-dev}
      AVEN_PROVISIONER_PASSWORD: ${AVEN_PROVISIONER_PASSWORD:-provisioner-dev}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aven"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    logging: *local-logging
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8025}:8025"

  migrator:
    <<: [*runtime-security, *aven-image]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://aven_migrator:${AVEN_MIGRATOR_PASSWORD:-migrator-dev}@db:5432/aven
    command: ["bun", "build/scripts/migrate.js"]
    restart: "no"

  app:
    <<: [*runtime-security, *aven-image]
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://aven_server:${AVEN_SERVER_PASSWORD:-server-dev}@db:5432/aven
      # adapter-node otherwise rejects streamed bodies above its 512 KiB default
      # before the Artifact route can apply its authenticated 25 MiB policy.
      BODY_SIZE_LIMIT: ${ARTIFACT_STORE_MAX_UPLOAD_BYTES:-26214400}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-for-real-deployments}
      EMAIL_QUEUE_ENCRYPTION_KEY: ${EMAIL_QUEUE_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      POLAR_API_KEY: ${POLAR_API_KEY:-}
      POLAR_SERVER: ${POLAR_SERVER:-sandbox}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-dev-fake-webhook-secret}
      LLM_GATEWAY_ENABLED: ${LLM_GATEWAY_ENABLED:-false}
      LLM_GATEWAY_MODELS_JSON: '${LLM_GATEWAY_MODELS_JSON:-[]}'
      LLM_GATEWAY_CREDENTIALS_JSON: '${LLM_GATEWAY_CREDENTIALS_JSON:-{}}'
      LLM_GATEWAY_TIMEOUT_SECONDS: ${LLM_GATEWAY_TIMEOUT_SECONDS:-180}
      LLM_GATEWAY_ALLOW_INSECURE_HTTP: ${LLM_GATEWAY_ALLOW_INSECURE_HTTP:-false}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

  email-worker:
    <<: [*runtime-security, *aven-image]
    healthcheck:
      disable: true
    depends_on:
      migrator:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://aven_email_worker:${AVEN_EMAIL_WORKER_PASSWORD:-email-dev}@db:5432/aven
      EMAIL_QUEUE_ENCRYPTION_KEY: ${EMAIL_QUEUE_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-Aven <no-reply@aven.local>}
    command: ["bun", "build/scripts/email-worker.js"]

  environment-worker:
    <<: [*runtime-security, *aven-image]
    healthcheck:
      disable: true
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://aven_environment_worker:${AVEN_ENVIRONMENT_WORKER_PASSWORD:-environment-dev}@db:5432/aven
      PROVISIONER_DATABASE_URL: postgres://aven_provisioner:${AVEN_PROVISIONER_PASSWORD:-provisioner-dev}@db:5432/postgres
    command: ["bun", "build/scripts/environment-worker.js"]

volumes:
  db-data:
