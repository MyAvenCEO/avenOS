x-local-logging: &local-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "${DOCKER_LOG_COMPRESS:-true}"

services:
  static-site-host:
    image: ${AVEN_STATIC_SITE_HOST_IMAGE:?AVEN_STATIC_SITE_HOST_IMAGE is required}
    restart: unless-stopped
    environment:
      SITE_HOST_MODE: snapshot
      SITE_HOST_LISTEN: 0.0.0.0:8093
      SITE_HOST_DATA_ROOT: /var/lib/aven/static-sites
    volumes:
      - ${AVEN_DATA_ROOT:-/var/lib/aven}/static-sites:/var/lib/aven/static-sites:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *local-logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      static-site-host:
        condition: service_healthy
    ports:
      - "${HOSTING_HTTP_BIND:-0.0.0.0}:${HOSTING_HTTP_PORT:-80}:80"
      - "${HOSTING_HTTPS_BIND:-0.0.0.0}:${HOSTING_HTTPS_PORT:-443}:443"
      - "${HOSTING_HTTPS_BIND:-0.0.0.0}:${HOSTING_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile.hosting-only:/etc/caddy/Caddyfile:ro
      - ${AVEN_DATA_ROOT:-/var/lib/aven}/caddy/data:/data
      - ${AVEN_DATA_ROOT:-/var/lib/aven}/caddy/config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *local-logging
