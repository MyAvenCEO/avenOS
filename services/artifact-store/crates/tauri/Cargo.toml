[package]
name = "aven-artifact-store-tauri"
description = "Tauri adapter for the Aven artifact store"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["remote"]
embedded-postgres = ["dep:aven-artifact-store-postgres"]
remote = ["dep:aven-artifact-store-client"]

[dependencies]
aven-artifact-store = { path = "../core" }
aven-artifact-store-client = { path = "../client", optional = true }
aven-artifact-store-postgres = { path = "../postgres", optional = true }

[lints]
workspace = true
