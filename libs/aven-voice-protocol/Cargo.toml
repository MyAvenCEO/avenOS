[package]
name = "aven-voice-protocol"
version = "26.8.28-next.2"
edition = "2021"
rust-version = "1.93"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
serde_json = "1.0.143"

[[bin]]
name = "generate-voice-protocol"
path = "src/bin/generate.rs"
