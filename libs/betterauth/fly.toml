# fly.toml — aven-api-next: the betterauth (Bun + Hono) auth/API server for the avenOS
# mainnet (Alberobello), next/staging channel. Serves https://api.next.aven.ceo.
#
# SINGLE MACHINE by design — deploy with `--ha=false` so exactly one machine is created,
# and auto_stop is off + min_machines_running = 1 so it stays up. STATELESS: all state is
# in Neon Postgres and the schema self-bootstraps on boot, so a redeploy/restart is safe.
#
# Runtime SECRETS are NOT in this file — set them once with `fly secrets set` (see README):
#   BETTER_AUTH_SECRET, NEON_PG_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   TINFOIL_API_KEY, POLAR_API_KEY.

app = "aven-api-next"
primary_region = "fra"   # near the Neon eu-central-1 Postgres

[build]
  dockerfile = "Dockerfile"

# Non-secret config (public URL + staging Polar). Secrets are set via `fly secrets`.
[env]
  BETTER_AUTH_URL = "https://api.next.aven.ceo"
  PUBLIC_BETTER_AUTH_URL = "https://api.next.aven.ceo"
  POLAR_SERVER = "sandbox"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep the single machine running (don't suspend on idle).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
