[package]
name = "aven-voice-runtime"
version = "26.8.28-next.9"
edition = "2021"
rust-version = "1.93"

[features]
default = []
software-aec = ["dep:sonora"]
silent-audio-e2e = ["dep:serde", "dep:serde_json"]

[dependencies]
aven-voice-core = { path = "../aven-voice-core" }
aven-voice-protocol = { path = "../aven-voice-protocol" }
crossbeam-channel = "=0.5.15"
crossbeam-queue = "=0.3.13"
log = "0.4"
audioadapter-buffers = "=5.2.0"
rubato = { version = "=5.0.0", default-features = false }
sonora = { version = "=0.2.0", optional = true }
unicode-normalization = "=0.1.24"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[[example]]
name = "silent_audio_fixture"
required-features = ["silent-audio-e2e"]

[dev-dependencies]
proptest = "=1.7.0"
