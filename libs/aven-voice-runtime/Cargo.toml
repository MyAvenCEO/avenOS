[package]
name = "aven-voice-runtime"
version = "26.8.28-next.9"
edition = "2021"
rust-version = "1.93"

[features]
default = []
software-aec = ["dep:sonora"]

[dependencies]
aven-voice-core = { path = "../aven-voice-core" }
aven-voice-protocol = { path = "../aven-voice-protocol" }
crossbeam-channel = "=0.5.15"
crossbeam-queue = "=0.3.13"
log = "0.4"
audioadapter-buffers = "=5.2.0"
rubato = { version = "=5.0.0", default-features = false }
sonora = { version = "=0.2.0", optional = true }
unicode-normalization = "=0.1.24"

[dev-dependencies]
proptest = "=1.7.0"
