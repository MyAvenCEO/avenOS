name: aven-platform

x-runtime-hardening: &runtime-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.0
  tmpfs: ["/tmp:size=128m,mode=1777"]

services:
  database:
    <<: *runtime-hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    tmpfs: ["/tmp:size=128m,mode=1777", "/var/run/postgresql:size=16m,mode=3777"]
    image: ${DATABASE_IMAGE:?required}
    restart: unless-stopped
    command: [postgres, -c, log_connections=on, -c, log_disconnections=on, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, "log_line_prefix=%m [%p] db=%d user=%u client=%h "]
    environment:
      CUSTOMER_PLATFORM_ID: ${BACKUP_ENVIRONMENT:?required}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?required}
      CHECKOUT_RUNTIME_PASSWORD: ${CHECKOUT_RUNTIME_PASSWORD:?required}
      CHECKOUT_WEBHOOK_PASSWORD: ${CHECKOUT_WEBHOOK_PASSWORD:?required}
      CHECKOUT_MIGRATOR_PASSWORD: ${CHECKOUT_MIGRATOR_PASSWORD:?required}
      CHECKOUT_EMAIL_PASSWORD: ${CHECKOUT_EMAIL_PASSWORD:?required}
      CHECKOUT_PLATFORM_EVENTS_PASSWORD: ${CHECKOUT_PLATFORM_EVENTS_PASSWORD:?required}
      API_HOSTING_PASSWORD: ${API_HOSTING_PASSWORD:?required}
      API_AUTHORIZATION_PASSWORD: ${API_AUTHORIZATION_PASSWORD:?required}
      API_ENTITLEMENTS_PASSWORD: ${API_ENTITLEMENTS_PASSWORD:?required}
      API_RECONCILER_PASSWORD: ${API_RECONCILER_PASSWORD:?required}
      API_MIGRATOR_PASSWORD: ${API_MIGRATOR_PASSWORD:?required}
      CUSTOMER_PROVISIONER_PASSWORD: ${CUSTOMER_PROVISIONER_PASSWORD:?required}
      ARTIFACT_STORE_PROVISIONER_DB_PASSWORD: ${ARTIFACT_STORE_PROVISIONER_DB_PASSWORD:?required}
      PLATFORM_BACKUP_PASSWORD: ${PLATFORM_BACKUP_PASSWORD:?required}
    volumes:
      - /var/lib/aven/postgres:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-platform.sql.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d aven_api]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  database-access:
    <<: *runtime-hardening
    image: ${DATABASE_IMAGE:?required}
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: [socat]
    command: ["TCP-LISTEN:5432,reuseaddr,fork", "TCP:database:5432"]
    depends_on:
      database:
        condition: service_healthy
    ports: ["127.0.0.1:5432:5432"]
    networks: [platform-private, platform-access]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
      interval: 3s
      timeout: 3s
      retries: 40
    security_opt: [no-new-privileges:true]

  artifact-provisioner-access:
    <<: *runtime-hardening
    image: ${DATABASE_IMAGE:?required}
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: [socat]
    command: ["TCP-LISTEN:8088,reuseaddr,fork", "TCP:artifact-store-provisioner:8088"]
    depends_on:
      artifact-store-provisioner:
        condition: service_healthy
    ports: ["127.0.0.1:8088:8088"]
    networks: [platform-private, platform-access]
    security_opt: [no-new-privileges:true]

  database-roles:
    <<: *runtime-hardening
    image: ${DATABASE_IMAGE:?required}
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    command: [sh, /db-init.sh]
    environment:
      PGHOST: database
      PGPASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?required}
      CUSTOMER_PLATFORM_ID: ${BACKUP_ENVIRONMENT:?required}
      POSTGRES_USER: postgres
      CHECKOUT_RUNTIME_PASSWORD: ${CHECKOUT_RUNTIME_PASSWORD:?required}
      CHECKOUT_WEBHOOK_PASSWORD: ${CHECKOUT_WEBHOOK_PASSWORD:?required}
      CHECKOUT_MIGRATOR_PASSWORD: ${CHECKOUT_MIGRATOR_PASSWORD:?required}
      CHECKOUT_EMAIL_PASSWORD: ${CHECKOUT_EMAIL_PASSWORD:?required}
      CHECKOUT_PLATFORM_EVENTS_PASSWORD: ${CHECKOUT_PLATFORM_EVENTS_PASSWORD:?required}
      API_HOSTING_PASSWORD: ${API_HOSTING_PASSWORD:?required}
      API_AUTHORIZATION_PASSWORD: ${API_AUTHORIZATION_PASSWORD:?required}
      API_ENTITLEMENTS_PASSWORD: ${API_ENTITLEMENTS_PASSWORD:?required}
      API_RECONCILER_PASSWORD: ${API_RECONCILER_PASSWORD:?required}
      API_MIGRATOR_PASSWORD: ${API_MIGRATOR_PASSWORD:?required}
      CUSTOMER_PROVISIONER_PASSWORD: ${CUSTOMER_PROVISIONER_PASSWORD:?required}
      ARTIFACT_STORE_PROVISIONER_DB_PASSWORD: ${ARTIFACT_STORE_PROVISIONER_DB_PASSWORD:?required}
      PLATFORM_BACKUP_PASSWORD: ${PLATFORM_BACKUP_PASSWORD:?required}
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  backup:
    <<: *runtime-hardening
    image: ${OPERATIONS_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      checkout-migrate:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: database
      PGUSER: aven_backup
      PGPASSWORD: ${PLATFORM_BACKUP_PASSWORD:?required}
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:?required}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:?required}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?required}
      AWS_REGION: ${BACKUP_S3_REGION:?required}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:?required}
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:?required}
      BACKUP_HOST: platform
      BACKUP_RELEASE_ID: ${RELEASE_ID:-unknown}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-7200}
      XDG_CACHE_HOME: /tmp/restic-cache
    volumes:
      - /var/lib/aven/backups:/var/lib/aven-backups
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    healthcheck:
      test: [CMD, /operations/entrypoint.sh, health]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 3m
    networks: [platform-private, platform-egress]
    security_opt: [no-new-privileges:true]

  restore:
    <<: *runtime-hardening
    profiles: [recovery]
    image: ${OPERATIONS_IMAGE:?required}
    command: [restore]
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGUSER: postgres
      PGPASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?required}
      RESTIC_REPOSITORY: ${RESTORE_REPOSITORY:-${BACKUP_RESTIC_REPOSITORY:?required}}
      RESTIC_PASSWORD: ${RESTORE_PASSWORD:-${BACKUP_RESTIC_PASSWORD:?required}}
      AWS_ACCESS_KEY_ID: ${RESTORE_ACCESS_KEY:-${BACKUP_S3_ACCESS_KEY_ID:?required}}
      AWS_SECRET_ACCESS_KEY: ${RESTORE_SECRET_KEY:-${BACKUP_S3_SECRET_ACCESS_KEY:?required}}
      AWS_REGION: ${RESTORE_REGION:-${BACKUP_S3_REGION:?required}}
      AWS_DEFAULT_REGION: ${RESTORE_REGION:-${BACKUP_S3_REGION:?required}}
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:?required}
      RESTORE_CONFIRMATION: fresh-target-only
      RESTORE_SNAPSHOT: ${RESTORE_SNAPSHOT:-latest}
      XDG_CACHE_HOME: /tmp/restic-cache
    volumes:
      - /var/lib/aven/backups:/var/lib/aven-backups
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    networks: [platform-private, platform-egress]
    security_opt: [no-new-privileges:true]

  checkout-migrate:
    <<: *runtime-hardening
    image: ${CHECKOUT_IMAGE:?required}
    restart: "no"
    depends_on:
      database-roles:
        condition: service_completed_successfully
    command: [bun, build/scripts/migrate.js]
    environment:
      DATABASE_URL: postgres://aven_checkout_http:${CHECKOUT_RUNTIME_PASSWORD}@database/aven_checkout
      MIGRATOR_DATABASE_URL: postgres://aven_checkout_migrator:${CHECKOUT_MIGRATOR_PASSWORD}@database/aven_checkout
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  checkout-billing-sync:
    <<: *runtime-hardening
    image: ${CHECKOUT_IMAGE:?required}
    restart: "no"
    depends_on:
      checkout-migrate:
        condition: service_completed_successfully
    command: [bun, build/scripts/seed-billing.js]
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: https://${CHECKOUT_DOMAIN:-portal.aven.ceo}
      DATABASE_URL: postgres://aven_checkout_http:${CHECKOUT_RUNTIME_PASSWORD}@database/aven_checkout
      WEBHOOK_DATABASE_URL: postgres://aven_checkout_webhooks:${CHECKOUT_WEBHOOK_PASSWORD}@database/aven_checkout
      FACADE_BEARER_TOKEN: ${CHECKOUT_FACADE_TOKEN:?required}
      DOWNLOAD_URL: ${DOWNLOAD_URL:?required}
      EMAIL_QUEUE_ENCRYPTION_KEY: ${CHECKOUT_EMAIL_ENCRYPTION_KEY:?required}
      ALLOW_FAKE_PAYMENTS: ${ALLOW_FAKE_PAYMENTS:-false}
      POLAR_API_KEY: ${POLAR_API_KEY:-}
      POLAR_SERVER: ${POLAR_SERVER:-production}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:?required}
    networks: [platform-private, platform-egress]
    security_opt: [no-new-privileges:true]

  api-migrate:
    <<: *runtime-hardening
    image: ${API_IMAGE:?required}
    restart: "no"
    depends_on:
      database-roles:
        condition: service_completed_successfully
    command: [bun, build/migrate.js]
    environment: &api-environment
      PORT: "3000"
      DATABASE_URL: postgres://aven_api_authorization:${API_AUTHORIZATION_PASSWORD}@database/aven_api
      HOSTING_DATABASE_URL: postgres://aven_api_hosting:${API_HOSTING_PASSWORD}@database/aven_api
      AUTHORIZATION_DATABASE_URL: postgres://aven_api_authorization:${API_AUTHORIZATION_PASSWORD}@database/aven_api
      ENTITLEMENTS_DATABASE_URL: postgres://aven_api_entitlements:${API_ENTITLEMENTS_PASSWORD}@database/aven_api
      MIGRATOR_DATABASE_URL: postgres://aven_api_migrator:${API_MIGRATOR_PASSWORD}@database/aven_api
      IDENTITY_ISSUER: https://aven.id
      IDENTITY_AUDIENCE: aven-services
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:?required}
      CHECKOUT_CAPABILITIES_URL: http://checkout:3000/api/health/capabilities
      BACKUP_HEALTH_FILE: /backup-health/health.json
      CUSTOMER_ENTITLEMENT_TOKEN: ${CUSTOMER_ENTITLEMENT_TOKEN:?required}
      TENANT_GRANT_PRIVATE_KEY: ${TENANT_GRANT_PRIVATE_KEY:?required}
      CORS_ORIGINS: ${PLATFORM_WEB_ORIGINS:?required}
      SITE_HOST_DIRECTORY_BEARER_TOKEN: ${SITE_HOST_DIRECTORY_BEARER_TOKEN:?required}
      SITE_HOST_PUBLIC_IPV4: ${PLATFORM_PUBLIC_IPV4:?required}
      SITE_HOST_PUBLIC_IPV6: ${PLATFORM_PUBLIC_IPV6:-}
      SYSTEM_SITES_JSON: ${SYSTEM_SITES_JSON:-[]}
      ARTIFACT_STORE_BASE_URL: http://artifact-store:8087
      ARTIFACT_STORE_BEARER_TOKEN: ${ARTIFACT_STORE_SERVICE_TOKEN:?required}
      LLM_GATEWAY_ENABLED: "true"
      LLM_GATEWAY_MODELS_JSON: ${LLM_GATEWAY_MODELS_JSON:?required}
      LLM_GATEWAY_CREDENTIALS_JSON: ${LLM_GATEWAY_CREDENTIALS_JSON:?required}
      LLM_GATEWAY_TIMEOUT_SECONDS: ${LLM_GATEWAY_TIMEOUT_SECONDS:-180}
      LLM_GATEWAY_ALLOW_INSECURE_HTTP: "false"
      LLM_GATEWAY_ACTOR_RUNNER_BEARER_TOKEN: ${ACTOR_RUNNER_LLM_GATEWAY_TOKEN:?required}
      DOWNSTREAMS_JSON: ${DOWNSTREAMS_JSON:?required}
      CUSTOMER_DOWNSTREAMS_JSON: ${CUSTOMER_DOWNSTREAMS_JSON:?required}
      CUSTOMER_RUNTIMES_JSON: ${CUSTOMER_RUNTIMES_JSON:-[]}
      CUSTOMER_RUNTIMES_FILE: ${CUSTOMER_RUNTIMES_FILE:-}
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  checkout:
    <<: *runtime-hardening
    image: ${CHECKOUT_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      checkout-billing-sync:
        condition: service_completed_successfully
    environment: &checkout-environment
      NODE_ENV: production
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      BODY_SIZE_LIMIT: "1048576"
      ORIGIN: https://${CHECKOUT_DOMAIN:-portal.aven.ceo}
      PUBLIC_BASE_URL: https://${CHECKOUT_DOMAIN:-portal.aven.ceo}
      DATABASE_URL: postgres://aven_checkout_http:${CHECKOUT_RUNTIME_PASSWORD}@database/aven_checkout
      WEBHOOK_DATABASE_URL: postgres://aven_checkout_webhooks:${CHECKOUT_WEBHOOK_PASSWORD}@database/aven_checkout
      IDENTITY_ISSUER: https://aven.id
      IDENTITY_AUDIENCE: aven-services
      IDENTITY_PROVISIONING_SECRET: ${IDENTITY_PROVISIONING_SECRET:?required}
      FACADE_BEARER_TOKEN: ${CHECKOUT_FACADE_TOKEN:?required}
      DOWNLOAD_URL: ${DOWNLOAD_URL:?required}
      EMAIL_QUEUE_ENCRYPTION_KEY: ${CHECKOUT_EMAIL_ENCRYPTION_KEY:?required}
      ALLOW_FAKE_PAYMENTS: ${ALLOW_FAKE_PAYMENTS:-false}
      POLAR_API_KEY: ${POLAR_API_KEY:-}
      POLAR_SERVER: ${POLAR_SERVER:-production}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:?required}
    networks: [platform-private, platform-ingress]
    security_opt: [no-new-privileges:true]

  email-worker:
    <<: *runtime-hardening
    image: ${CHECKOUT_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      checkout-migrate:
        condition: service_completed_successfully
    command: [bun, build/scripts/email-worker.js]
    healthcheck:
      test: [CMD, bun, -e, "import pg from 'pg'; const pool = new pg.Pool({ connectionString: process.env.EMAIL_WORKER_DATABASE_URL }); const result = await pool.query(\"SELECT last_heartbeat_at > now() - interval '30 seconds' AS healthy FROM worker_heartbeats WHERE worker_name = 'email-worker'\"); await pool.end(); process.exit(result.rows[0]?.healthy ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: https://${CHECKOUT_DOMAIN:-portal.aven.ceo}
      DATABASE_URL: postgres://aven_checkout_email:${CHECKOUT_EMAIL_PASSWORD}@database/aven_checkout
      EMAIL_WORKER_DATABASE_URL: postgres://aven_checkout_email:${CHECKOUT_EMAIL_PASSWORD}@database/aven_checkout
      EMAIL_QUEUE_ENCRYPTION_KEY: ${CHECKOUT_EMAIL_ENCRYPTION_KEY:?required}
      SMTP_URL: ${SMTP_URL:?required}
      SMTP_FROM: ${SMTP_FROM:?required}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
    networks: [platform-private, platform-egress]
    security_opt: [no-new-privileges:true]

  platform-event-worker:
    <<: *runtime-hardening
    image: ${CHECKOUT_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      checkout-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: [bun, build/scripts/platform-event-worker.js]
    healthcheck:
      test: [CMD, bun, -e, "import pg from 'pg'; const pool = new pg.Pool({ connectionString: process.env.PLATFORM_EVENT_WORKER_DATABASE_URL }); await pool.query('SELECT 1 FROM platform_event_outbox LIMIT 1'); await pool.end()"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: https://${CHECKOUT_DOMAIN:-portal.aven.ceo}
      DATABASE_URL: postgres://aven_checkout_platform_events:${CHECKOUT_PLATFORM_EVENTS_PASSWORD}@database/aven_checkout
      PLATFORM_EVENT_WORKER_DATABASE_URL: postgres://aven_checkout_platform_events:${CHECKOUT_PLATFORM_EVENTS_PASSWORD}@database/aven_checkout
      PLATFORM_API_INTERNAL_URL: http://api:3000
      PLATFORM_EVENT_TOKEN: ${CUSTOMER_ENTITLEMENT_TOKEN:?required}
      EMAIL_QUEUE_ENCRYPTION_KEY: ${CHECKOUT_EMAIL_ENCRYPTION_KEY:?required}
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  platform-provisioner:
    <<: *runtime-hardening
    image: ${PLATFORM_PROVISIONER_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      artifact-store-provisioner:
        condition: service_healthy
    environment:
      CLUSTER_DATABASE_URL: postgres://aven_customer_provisioner:${CUSTOMER_PROVISIONER_PASSWORD}@database/postgres
      CUSTOMER_RUNTIME_ID: ${CUSTOMER_RUNTIME_ID:-primary}
      CONTROL_DATABASE_URL: postgres://aven_api_reconciler:${API_RECONCILER_PASSWORD}@database/aven_api
      INTENTS_API_DB_CREDENTIAL_ROOT: ${INTENT_DATABASE_CREDENTIAL_ROOT:?required}
      ACTOR_API_DB_CREDENTIAL_ROOT: ${ACTOR_API_DATABASE_CREDENTIAL_ROOT:?required}
      ACTOR_WORKER_DB_CREDENTIAL_ROOT: ${ACTOR_WORKER_DATABASE_CREDENTIAL_ROOT:?required}
      ARTIFACT_API_DB_CREDENTIAL_ROOT: ${ARTIFACT_API_DATABASE_CREDENTIAL_ROOT:?required}
      ARTIFACT_STORE_PROVISIONER_URL: http://artifact-store-provisioner:8088
      ARTIFACT_STORE_PROVISIONER_TOKEN: ${ARTIFACT_STORE_PROVISIONER_TOKEN:?required}
      ARTIFACT_STORE_PROVISIONER_DATABASE_ROLE: aven_artifact_store_provisioner
      BACKUP_DATABASE_ROLE: aven_backup
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  artifact-store-provisioner:
    <<: *runtime-hardening
    image: ${ARTIFACT_STORE_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      database-roles:
        condition: service_completed_successfully
    command: [serve-provisioner]
    environment:
      ARTIFACT_STORE_PROVISIONER_DATABASE_URL: postgres://aven_artifact_store_provisioner:${ARTIFACT_STORE_PROVISIONER_DB_PASSWORD}@database/postgres
      ARTIFACT_STORE_PROVISIONER_BEARER_TOKEN: ${ARTIFACT_STORE_PROVISIONER_TOKEN:?required}
      ARTIFACT_STORE_PROVISIONER_LISTEN: 0.0.0.0:8088
      ARTIFACT_STORE_HEALTH_PORT: "8088"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8088/health/ready]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  artifact-store:
    <<: *runtime-hardening
    image: ${ARTIFACT_STORE_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      artifact-store-provisioner:
        condition: service_healthy
    environment:
      ARTIFACT_STORE_DATABASE_URL: postgres://unused:unused@database/postgres
      ARTIFACT_STORE_API_DB_CREDENTIAL_ROOT: ${ARTIFACT_API_DATABASE_CREDENTIAL_ROOT:?required}
      ARTIFACT_STORE_BEARER_TOKEN: ${ARTIFACT_STORE_SERVICE_TOKEN:?required}
      ARTIFACT_STORE_ACTOR_RUNNER_BEARER_TOKEN: ${ACTOR_RUNNER_ARTIFACT_STORE_TOKEN:?required}
      ARTIFACT_STORE_PUBLISHER_ISSUER: ${API_DOMAIN:?required}
      ARTIFACT_STORE_PUBLISHER_SUBJECT: service:aven-api
      ARTIFACT_STORE_TENANT_MODE: "true"
      ARTIFACT_STORE_LISTEN: 0.0.0.0:8087
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8087/health/ready]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform-private]
    security_opt: [no-new-privileges:true]

  intent-service:
    <<: *runtime-hardening
    image: ${INTENT_SERVICE_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      platform-provisioner:
        condition: service_started
    environment:
      CUSTOMER_DATABASE_HOST: database
      CUSTOMER_DATABASE_PORT: "5432"
      CUSTOMER_DATABASE_SSL: "false"
      INTENT_DATABASE_CREDENTIAL_ROOT: ${INTENT_DATABASE_CREDENTIAL_ROOT:?required}
      INTENT_SERVICE_BEARER_TOKEN: ${INTENT_SERVICE_TOKEN:?required}
      IDENTITY_ISSUER: https://aven.id
      IDENTITY_AUDIENCE: aven-services
      TENANT_GRANT_ISSUER: ${API_PUBLIC_BASE_URL:?required}
      TENANT_GRANT_PUBLIC_KEY: ${TENANT_GRANT_PUBLIC_KEY:?required}
    networks: [platform-private, platform-egress]
    security_opt: [no-new-privileges:true]

  actor-runner:
    <<: *runtime-hardening
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    tmpfs: ["/tmp:size=512m,mode=1777"]
    image: ${ACTOR_RUNNER_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      platform-provisioner:
        condition: service_started
    environment:
      PORT: "3010"
      CUSTOMER_DATABASE_HOST: database
      CUSTOMER_DATABASE_PORT: "5432"
      CUSTOMER_DATABASE_SSL: "false"
      ACTOR_API_DB_CREDENTIAL_ROOT: ${ACTOR_API_DATABASE_CREDENTIAL_ROOT:?required}
      ACTOR_WORKER_DB_CREDENTIAL_ROOT: ${ACTOR_WORKER_DATABASE_CREDENTIAL_ROOT:?required}
      ACTOR_RUNNER_SERVICE_BEARER_TOKEN: ${ACTOR_RUNNER_SERVICE_TOKEN:?required}
      IDENTITY_ISSUER: https://aven.id
      IDENTITY_AUDIENCE: aven-services
      TENANT_GRANT_ISSUER: ${API_PUBLIC_BASE_URL:?required}
      TENANT_GRANT_PUBLIC_KEY: ${TENANT_GRANT_PUBLIC_KEY:?required}
      ARTIFACT_STORE_BASE_URL: http://artifact-store:8087
      ARTIFACT_STORE_BEARER_TOKEN: ${ACTOR_RUNNER_ARTIFACT_STORE_TOKEN:?required}
      LLM_GATEWAY_BASE_URL: http://api:3000/internal/v1/llm
      LLM_GATEWAY_BEARER_TOKEN: ${ACTOR_RUNNER_LLM_GATEWAY_TOKEN:?required}
    networks: [platform-private, platform-egress]
    security_opt: [no-new-privileges:true]

  api:
    <<: *runtime-hardening
    image: ${API_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      checkout:
        condition: service_started
      artifact-store:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - /var/lib/aven/backups/public-status:/backup-health:ro
      - /var/lib/aven/runtime-routing:/runtime-routing:ro
      - /var/lib/aven/runtime-backup-health:/runtime-backup-health:ro
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platform-private, platform-ingress]
    security_opt: [no-new-privileges:true]

  static-site-host:
    <<: *runtime-hardening
    ulimits:
      fsize:
        soft: 536870912
        hard: 536870912
    image: ${STATIC_SITE_HOST_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_HOST_LISTEN: 0.0.0.0:8093
      SITE_HOST_DATA_ROOT: /data
      SITE_HOST_DIRECTORY_URL: http://api:3000/internal/v1/static-sites/bindings
      SITE_HOST_STATUS_URL: http://api:3000/internal/v1/static-sites/status
      SITE_HOST_DIRECTORY_BEARER_TOKEN: ${SITE_HOST_DIRECTORY_BEARER_TOKEN:?required}
      SITE_HOST_ALLOWED_IPV4: ${PLATFORM_PUBLIC_IPV4:?required}
      SITE_HOST_ALLOWED_IPV6: ${PLATFORM_PUBLIC_IPV6:-}
      SITE_HOST_POLL_SECONDS: "30"
      SITE_HOST_MAX_CONCURRENT_SYNCS: "2"
    volumes:
      - /var/lib/aven/static-sites:/data
    networks: [platform-private, platform-ingress]
    security_opt: [no-new-privileges:true]

  caddy:
    <<: *runtime-hardening
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    image: ${PROXY_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      static-site-host:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.aven.ceo}
      CHECKOUT_DOMAIN: ${CHECKOUT_DOMAIN:-portal.aven.ceo}
      ACME_EMAIL: ${ACME_EMAIL:?required}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/aven/caddy/data:/data
      - /var/lib/aven/caddy/config:/config
    networks: [platform-ingress]
    security_opt: [no-new-privileges:true]

networks:
  platform-private:
    internal: true
  platform-ingress:
  platform-egress:
  # These credential-free TCP forwarders publish only to the host loopback interface.
  platform-access:
