name: aven-identity

x-runtime-hardening: &runtime-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.0
  tmpfs: ["/tmp:size=128m,mode=1777"]

services:
  database:
    <<: *runtime-hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1g
    pids_limit: 256
    tmpfs: ["/tmp:size=128m,mode=1777", "/var/run/postgresql:size=16m,mode=3777"]
    image: ${DATABASE_IMAGE:?required}
    restart: unless-stopped
    command: [postgres, -c, log_connections=on, -c, log_disconnections=on, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, "log_line_prefix=%m [%p] db=%d user=%u client=%h "]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
      IDENTITY_AUTH_PASSWORD: ${IDENTITY_AUTH_PASSWORD:?required}
      IDENTITY_ACCOUNTS_PASSWORD: ${IDENTITY_ACCOUNTS_PASSWORD:?required}
      IDENTITY_AUTHORIZATION_PASSWORD: ${IDENTITY_AUTHORIZATION_PASSWORD:?required}
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?required}
      IDENTITY_BACKUP_PASSWORD: ${IDENTITY_BACKUP_PASSWORD:?required}
    volumes:
      - /var/lib/aven/postgres:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-identity.sql.sh:ro
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d aven_identity]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [identity-private]
    security_opt: [no-new-privileges:true]

  database-roles:
    <<: *runtime-hardening
    image: ${DATABASE_IMAGE:?required}
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    command: [sh, /db-init.sh]
    environment:
      PGHOST: database
      PGPASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
      POSTGRES_USER: postgres
      IDENTITY_AUTH_PASSWORD: ${IDENTITY_AUTH_PASSWORD:?required}
      IDENTITY_ACCOUNTS_PASSWORD: ${IDENTITY_ACCOUNTS_PASSWORD:?required}
      IDENTITY_AUTHORIZATION_PASSWORD: ${IDENTITY_AUTHORIZATION_PASSWORD:?required}
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?required}
      IDENTITY_BACKUP_PASSWORD: ${IDENTITY_BACKUP_PASSWORD:?required}
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    networks: [identity-private]
    security_opt: [no-new-privileges:true]

  backup:
    <<: *runtime-hardening
    image: ${OPERATIONS_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: database
      PGUSER: aven_backup
      PGPASSWORD: ${IDENTITY_BACKUP_PASSWORD:?required}
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:?required}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:?required}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?required}
      AWS_REGION: ${BACKUP_S3_REGION:?required}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:?required}
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:?required}
      BACKUP_HOST: identity
      BACKUP_RELEASE_ID: ${RELEASE_ID:-unknown}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-7200}
      XDG_CACHE_HOME: /tmp/restic-cache
    volumes:
      - /var/lib/aven/backups:/var/lib/aven-backups
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    healthcheck:
      test: [CMD, /operations/entrypoint.sh, health]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 3m
    networks: [identity-private, identity-egress]
    security_opt: [no-new-privileges:true]

  restore:
    <<: *runtime-hardening
    profiles: [recovery]
    image: ${OPERATIONS_IMAGE:?required}
    command: [restore]
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGUSER: postgres
      PGPASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:?required}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:?required}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?required}
      AWS_REGION: ${BACKUP_S3_REGION:?required}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:?required}
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:?required}
      RESTORE_CONFIRMATION: fresh-target-only
      XDG_CACHE_HOME: /tmp/restic-cache
    volumes:
      - /var/lib/aven/backups:/var/lib/aven-backups
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    networks: [identity-private, identity-egress]
    security_opt: [no-new-privileges:true]

  migrate:
    <<: *runtime-hardening
    image: ${IDENTITY_IMAGE:?required}
    restart: "no"
    depends_on:
      database-roles:
        condition: service_completed_successfully
    command: [bun, build/scripts/migrate.js]
    environment: &identity-environment
      NODE_ENV: production
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      BODY_SIZE_LIMIT: "131072"
      ORIGIN: https://${IDENTITY_DOMAIN:-aven.id}
      PUBLIC_BASE_URL: https://${IDENTITY_DOMAIN:-aven.id}
      WEBAUTHN_RP_ID: ${IDENTITY_DOMAIN:-aven.id}
      TRUSTED_WEB_ORIGINS: ${TRUSTED_WEB_ORIGINS-}
      ANDROID_APP_CERT_SHA256_FINGERPRINTS: ${ANDROID_APP_CERT_SHA256_FINGERPRINTS:-}
      DATABASE_URL: postgres://aven_identity_auth:${IDENTITY_AUTH_PASSWORD}@database/aven_identity
      ACCOUNTS_DATABASE_URL: postgres://aven_identity_accounts:${IDENTITY_ACCOUNTS_PASSWORD}@database/aven_identity
      AUTHORIZATION_DATABASE_URL: postgres://aven_identity_authorization:${IDENTITY_AUTHORIZATION_PASSWORD}@database/aven_identity
      MIGRATOR_DATABASE_URL: postgres://aven_identity_migrator:${IDENTITY_MIGRATOR_PASSWORD}@database/aven_identity
      BETTER_AUTH_SECRET: ${IDENTITY_BETTER_AUTH_SECRET:?required}
      IDENTITY_PROVISIONING_SECRETS: ${IDENTITY_PROVISIONING_SECRETS?required}
      IDENTITY_ALLOW_NO_PLATFORMS: ${IDENTITY_ALLOW_NO_PLATFORMS:-false}
      IDENTITY_MAIL_ORIGINS: ${IDENTITY_MAIL_ORIGINS-}
      REQUIRE_PASSKEY_PRF: "false"
    networks: [identity-private]
    security_opt: [no-new-privileges:true]

  identity:
    <<: *runtime-hardening
    image: ${IDENTITY_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *identity-environment
      BACKUP_HEALTH_FILE: /backup-health/health.json
    volumes:
      - /var/lib/aven/backups/public-status:/backup-health:ro
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [identity-private, identity-ingress]
    security_opt: [no-new-privileges:true]

  caddy:
    <<: *runtime-hardening
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    image: ${PROXY_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
    environment:
      IDENTITY_DOMAIN: ${IDENTITY_DOMAIN:-aven.id}
      IDENTITY_PLATFORM_IPS: ${IDENTITY_PLATFORM_IPS-}
      ACME_EMAIL: ${ACME_EMAIL:?required}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/aven/caddy/data:/data
      - /var/lib/aven/caddy/config:/config
    networks: [identity-ingress]
    security_opt: [no-new-privileges:true]

networks:
  identity-private:
    internal: true
  identity-ingress:
  identity-egress:
